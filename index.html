/* ---------- Filtrage ---------- */
function plSelected(vals, ids) {
  return !vals.length ? ids.slice() : vals.filter(function (v) { return ids.indexOf(v) >= 0; });
}
function plCollect(weeks) {
  /* union des agents des semaines cochées (toutes si aucune cochée),
     limités au projet de l'activité en cours (rubrique scopée par projet) */
  const act = store.data.activityId;
  const weekIds = weeks.map(function (w) { return w.week; });
  const selWeeks = plSelected(plState.semaine, weekIds);
  const out = [];
  weeks.forEach(function (w) {
    if (!w || !Array.isArray(w.agents)) return;       // fiche malformée ignorée
    if (selWeeks.indexOf(w.week) < 0) return;
    w.agents.forEach(function (a) {
      const aid = plProjOfName(a.p);
      if (!aid) return;                                 // projets hors périmètre ignorés
      if (PL_PROJECTS[act] && aid !== act) return;      // autre projet que l'activité en cours
      out.push({ wk: w.week, a: a });
    });
  });
  return out;
}

/* ---------- Rendu ---------- */
function plMselHtml(key, tag, opts, allLabel) {
  return '<div class="msel" data-key="' + key + '">' +
    '<button type="button" class="msel-btn" aria-expanded="false">' +
    '<span class="msel-tag">' + esc(tag) + '</span><b class="msel-val"></b>' +
    '<span class="chev">' + ic("chevron", 14) + "</span></button>" +
    '<div class="msel-panel">' +
    '<label class="msel-all"><input type="checkbox" class="msel-master"> <span>' + esc(allLabel) + "</span></label>" +
    '<input type="text" class="msel-search" placeholder="Rechercher…" aria-label="Rechercher dans ' + esc(tag) + '">' +
    '<div class="msel-opts">' + opts.map(function (o) {
      const hay = plNorm((o.label || "") + " " + (o.hint || ""));
      return '<label class="msel-opt" data-q="' + esc(hay) + '">' +
        '<input type="checkbox" value="' + esc(o.id) + '"' + (plState[key].indexOf(o.id) >= 0 ? " checked" : "") + ">" +
        "<span>" + esc(o.label) + "</span></label>";
    }).join("") + "</div></div></div>";
}
function plUpdateLabels(scope) {
  $all(".msel", scope).forEach(function (box) {
    const key = box.dataset.key;
    const vals = plState[key] || [];
    const optIds = Array.prototype.slice.call(box.querySelectorAll(".msel-opt input")).map(function (i) { return i.value; });
    const btn = box.querySelector(".msel-val");
    if (!btn) return;
    const allTxt = key === "semaine" ? "Toutes les semaines" : key === "debut" ? "Tous les débuts"
      : key === "jour" ? "Tous les jours" : "Tous les agents";
    const unit = key === "semaine" ? " semaines" : key === "debut" ? " débuts" : key === "jour" ? " jours" : " agents";
    let txt;
    if (!vals.length || vals.length === optIds.length) txt = allTxt;
    else if (vals.length === 1) {
      const lab = box.querySelector('.msel-opt input[value="' + CSS.escape(vals[0]) + '"]');
      txt = lab ? lab.closest(".msel-opt").querySelector("span").textContent : vals[0];
    } else txt = vals.length + unit;
    btn.textContent = txt;
    const master = box.querySelector(".msel-master");
    if (master) master.checked = !!optIds.length && vals.length === optIds.length;
  });
}
function plBindMsel(root) {
  $all(".msel", root).forEach(function (box) {
    const key = box.dataset.key;
    const btn = box.querySelector(".msel-btn");
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      const wasOpen = box.classList.contains("open");
      $all(".msel.open").forEach(function (b) { b.classList.remove("open"); });
      if (!wasOpen) {
        box.classList.add("open"); btn.setAttribute("aria-expanded", "true");
        const si = box.querySelector(".msel-search");
        if (si) si.focus();
      }
    });
    /* recherche dans la liste d'options (insensible à la casse/aux accents) */
    const search = box.querySelector(".msel-search");
    if (search) {
      search.addEventListener("input", function () {
        const q = plNorm(search.value);
        Array.prototype.slice.call(box.querySelectorAll(".msel-opt")).forEach(function (opt) {
          opt.style.display = (!q || (opt.dataset.q || "").indexOf(q) >= 0) ? "" : "none";
        });
      });
      search.addEventListener("click", function (e) { e.stopPropagation(); });
    }
    box.addEventListener("change", function (e) {
      const t = e.target;
      const opts = Array.prototype.slice.call(box.querySelectorAll(".msel-opt input"));
      if (t.classList && t.classList.contains("msel-master")) {
        plState[key] = t.checked ? opts.map(function (i) { return i.value; }) : [];
        opts.forEach(function (i) { i.checked = t.checked; });
        plUpdateLabels(root);
        plRefreshBody();
      } else if (t.matches && t.matches(".msel-opt input")) {
        plState[key] = opts.filter(function (c) { return c.checked; }).map(function (c) { return c.value; });
        plUpdateLabels(root);
        plRefreshBody();
      }
    });
  });
  if (!plDocBound) {
    plDocBound = true;
    document.addEventListener("click", function (e) {
      if (!e.target.closest || !e.target.closest(".msel")) {
        $all(".msel.open").forEach(function (b) { b.classList.remove("open"); });
      }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") $all(".msel.open").forEach(function (b) { b.classList.remove("open"); });
    });
  }
}

    "(feuille « Modification PROD ») importé depuis <b>CONFIG → Alimentation DATA</b>. " +

    '<div id="plRoot"></div>';

}

async function plRefreshBody() {
  const root = $("#plRoot");
  if (!root) return;
  let weeks = [];
  try { weeks = await plAllWeeks(); } catch (e) { weeks = []; }
  weeks.sort(function (x, y) { return x.week < y.week ? -1 : x.week > y.week ? 1 : 0; });

  /* resynchronisation des filtres sur les données existantes ;
     l'affichage est scopé sur le projet de l'activité en cours */
  const act = store.data.activityId;
  const meta = PL_PROJECTS[act];
  const weekIds = weeks.map(function (w) { return w.week; });
  plState.semaine = plState.semaine.filter(function (v) { return weekIds.indexOf(v) >= 0; });
  const allPairs = plCollect(weeks);
  /* débuts de shift disponibles dans le périmètre (projet + semaines),
     avec le nombre d'occurrences agent-jour de chaque heure */
  const debutIds = [];
  const debCount = {};
  allPairs.forEach(function (p) {
    PL_DAYS.forEach(function (d) {
      const dc = p.a.d[PL_DAYS.indexOf(d)];
      if (dc && dc.k === "work") {
        if (debutIds.indexOf(dc.s) < 0) debutIds.push(dc.s);
        debCount[dc.s] = (debCount[dc.s] || 0) + 1;
      }
    });
  });
  debutIds.sort();
  plState.debut = plState.debut.filter(function (v) { return debutIds.indexOf(v) >= 0; });
  const agentIds = [];
  allPairs.forEach(function (p) { if (agentIds.indexOf(p.a.n) < 0) agentIds.push(p.a.n); });
  agentIds.sort(function (x, y) { return x.localeCompare(y, "fr"); });
  plState.agent = plState.agent.filter(function (v) { return agentIds.indexOf(v) >= 0; });

  const days = plSelected(plState.jour, PL_DAYS);
  const showDays = days.length ? days : PL_DAYS;
  /* filtre début de shift : l'agent passe si au moins un jour affiché
     commence à une des heures cochées (rien de coché = tout voir) */
  const debSel = plSelected(plState.debut, debutIds);
  const matchDebut = function (p) {
    if (!plState.debut.length) return true;
    return showDays.some(function (d) {
      const dc = p.a.d[PL_DAYS.indexOf(d)];
      return !!(dc && dc.k === "work" && debSel.indexOf(dc.s) >= 0);
    });
  };
  const selAgents = allPairs.filter(function (p) {
    return plSelected(plState.agent, agentIds).indexOf(p.a.n) >= 0 && matchDebut(p);
  });
  const nWk = plSelected(plState.semaine, weekIds).length;

  let html = "";

  /* --- filtres + données (l'import se fait dans CONFIG -> Alimentation DATA) --- */
  if (!weeks.length) {
    html += '<div class="card"><div class="empty">Aucun planning importé : chargez un fichier ' +
      "« Validation Planning » depuis le menu <b>CONFIG → Alimentation DATA</b> " +
      "pour afficher le planning du projet." + plGoAlimBtn() + "</div></div>";
    root.innerHTML = html;
    plBindGoAlim(root);
    return;
  }
  if (!allPairs.length) {
    html += '<div class="card"><div class="empty">Aucun agent' +
      (meta ? " du projet " + esc(meta.label) : "") +
      " dans les semaines importées : le fichier planning ne contient pas ce projet, " +
      "ou les semaines sélectionnées ne le couvrent pas. Importez une autre semaine depuis " +
      "<b>CONFIG → Alimentation DATA</b>." + plGoAlimBtn() + "</div></div>";
    root.innerHTML = html;
    plBindGoAlim(root);
    return;
  }

  /* options agent : le matricule est ajouté au texte cherchable (data-q) */
  const payOf = {};
  allPairs.forEach(function (p) { if (!payOf[p.a.n] && p.a.pay) payOf[p.a.n] = p.a.pay; });
  const agentOpts = agentIds.map(function (n) { return { id: n, label: n, hint: payOf[n] || "" }; });
  const dayOpts = PL_DAYS.map(function (d) { return { id: d, label: PL_DAY_LABELS[d] }; });
  const weekOpts = weeks.map(function (w) { return { id: w.week, label: w.week + " (" + plWkCount(w).n + ")" }; });
  const debutOpts = debutIds.map(function (t) { return { id: t, label: t + " (" + debCount[t] + ")" }; });

  html += '<div class="card sc-filters" id="plFilters"><div class="filters">' +
    (meta ? '<div class="pl-proj-tag">' + ic("calendar", 14) + " Projet : " + esc(meta.label) + "</div>" : "") +
    plMselHtml("semaine", "SEMAINE", weekOpts, "Toutes les semaines") +
    plMselHtml("debut", "DÉBUT DE SHIFT", debutOpts, "Tous les débuts") +
    plMselHtml("agent", "AGENT", agentOpts, "Tous les agents") +
    plMselHtml("jour", "JOUR", dayOpts, "Tous les jours") +
    "</div></div>";

  if (!selAgents.length) {
    html += '<div class="card"><div class="empty">Aucun agent ne correspond aux filtres sélectionnés ' +
      "(semaine, début de shift, agent ou jour).</div></div>";
    root.innerHTML = html;
    plBindMsel(root);
    plUpdateLabels(root);
    return;
  }

  /* --- synthèse : agents actifs par jour --- */
  const sum = { work: 0, conge: 0, repos: 0 };
  const perDay = {};
  showDays.forEach(function (d) { perDay[d] = { work: 0, conge: 0, repos: 0 }; });
  const seen = {};
  selAgents.forEach(function (p) {
    const key = p.wk + "\u0000" + p.a.n + "\u0000" + p.a.p;
    if (seen[key]) return;                          // même agent sur plusieurs semaines -> compté par semaine
    seen[key] = 1;
    showDays.forEach(function (d) {
      const k = plDayKey(p.a.d[PL_DAYS.indexOf(d)]);
      if (k && perDay[d] && perDay[d][k] !== undefined) { perDay[d][k]++; sum[k]++; }
    });
  });
  const nSel = seen ? Object.keys(seen).length : 0;
  html += '<div class="card"><h2>' + ic("users", 16) + " Agents actifs — synthèse</h2>" +
    '<div class="chips">' +
    '<div class="chip"><b>' + nSel + "</b>" + (nWk > 1 ? "lignes d'agents (semaine × agent)" : "agent(s) sélectionné(s)") + "</div>" +
    '<div class="chip"><b>' + sum.work + "</b>en prod (agent-jours)</div>" +
    '<div class="chip"><b>' + sum.conge + "</b>en congé (agent-jours)</div>" +
    '<div class="chip"><b>' + sum.repos + "</b>en repos (agent-jours)</div>" +
    "</div>";
  html += '<div class="table-wrap"><table class="dmt pl-sum"><thead><tr><th></th>' +
    showDays.map(function (d) { return "<th>" + esc(PL_DAY_LABELS[d].slice(0, 3)) + "</th>"; }).join("") +
    '<th class="num">Total</th></tr></thead><tbody>';
  [["work", "En prod"], ["conge", "En congé"], ["repos", "En repos"]].forEach(function (row) {
    const tot = showDays.reduce(function (acc, d) { return acc + perDay[d][row[0]]; }, 0);
    html += "<tr><td>" + esc(row[1]) + "</td>" +
      showDays.map(function (d) { return "<td>" + perDay[d][row[0]] + "</td>"; }).join("") +
      '<td class="num"><b>' + tot + "</b></td></tr>";
  });
  html += "</tbody></table></div></div>";

  /* --- un tableau par projet --- */
  const byProj = {};
  selAgents.forEach(function (p) { (byProj[p.a.p] = byProj[p.a.p] || []).push(p); });
  const order = Object.keys(byProj).sort(function (x, y) { return x.localeCompare(y, "fr"); });
  order.forEach(function (proj) {
    const list = byProj[proj].slice().sort(function (x, y) { return x.a.n.localeCompare(y.a.n, "fr"); });
    html += '<div class="card"><h2>' + ic("calendar", 16) + " " + esc(proj) +
      '<span class="pl-count">' + list.length + " ligne(s)</span></h2>" +
      '<div class="table-wrap"><table class="dmt"><thead><tr>' +
      (nWk > 1 ? "<th>Semaine</th>" : "") + "<th>Agent</th><th>Fonction</th><th>Statut</th>" +
      showDays.map(function (d) { return "<th>" + esc(PL_DAY_LABELS[d].slice(0, 3)) + "</th>"; }).join("") +
      '<th class="num">Total</th></tr></thead><tbody>';
    list.forEach(function (p) {
      const a = p.a;
      let tot = 0;
      html += (nWk > 1 ? "<td>" + esc(p.wk) + "</td>" : "") +
        "<td>" + esc(a.n) + (a.pay ? ' <span class="pl-d">' + esc(a.pay) + "</span>" : "") + "</td>" +
        '<td><span class="pl-fn">' + esc(a.bt || "—") + "</span></td>" +
        '<td><span class="' + ((a.st || "").indexOf("FIM") >= 0 ? "pl-st-fim" : "") + '">' + esc(a.st || "—") + "</span></td>";
      showDays.forEach(function (d) {
        const dc = a.d[PL_DAYS.indexOf(d)];
        if (dc && dc.k === "work") tot += dc.net;
        html += "<td>" + plDayHtml(dc) + "</td>";
      });
      html += '<td class="num"><b>' + plFmtDur(tot) + "</b></td></tr>";
    });
    html += "</tbody></table></div></div>";
  });

  root.innerHTML = html;
  plBindMsel(root);
  plUpdateLabels(root);
}

/* --- import de fichier + suppression de semaines (boîte Alimentation DATA) --- */
function plBindImport(scope) {
  const inp = scope.querySelector("#plFile");
  if (inp) {
    inp.addEventListener("change", function () {
      const file = this.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function () {
        plMsg = { txt: "Import en cours : " + file.name + "…", err: false };
        plRenderImportBox().then(function () {
          plImportFile(reader.result, file.name).then(function (rec) {
            plMsg = { txt: "Import réussi : " + rec.week + " — " + rec.agents.length + " agents conservés sur " +
              (rec.nTotal || rec.agents.length) + " (projets Bytel, Driiveme, Legalplace, Stych)" +
              (rec.nDropped ? " · " + rec.nDropped + " agents d'autres projets ignorés" : "") + ".", err: false };
            plState.semaine = [rec.week];
            plState.debut = [];
            plState.agent = [];
            toast("Planning " + rec.week + " importé (" + rec.agents.length + " agents)");
            plRenderImportBox();
          }).catch(function (e) {
            plMsg = { txt: "Import impossible : " + (e && e.message ? e.message : e), err: true };
            toast("Import impossible : " + (e && e.message ? e.message : e));
            plRenderImportBox();
          });
        });
      };

/* ============================================================
   DOSSIER LOCAL LIÉ (File System Access API)
   L'utilisateur lie une seule fois un dossier de son ordinateur ;
   à chaque démarrage de l'outil, le dossier est scanné et les
   fichiers reconnus sont réimportés automatiquement :
   - « Validation Planning Sxx_aaaa »  -> import planning
   - « Demande de rappel »             -> import joignabilité
   - export Ringover (.csv)            -> import DMT / appels
   Le navigateur interdit tout chemin d'accès en dur : l'accès
   passe par une autorisation explicite, mémorisée par dossier.
   Le handle du dossier est conservé en IndexedDB (base « bo-sup »,
   magasin « fslink »). Chrome / Edge sur ordinateur uniquement ;
   l'import manuel reste toujours possible ci-dessous.
   ============================================================ */
const FS_KEY = "link";
/* Reconnaissance des fichiers par mots-clés du nom (sans accents, minuscules). */
const FS_MATCHERS = [
  { kind: "planning", label: "Planning",
    test: function (n) { return n.indexOf("modification prod") >= 0 || n.indexOf("validation planning") >= 0; } },
  { kind: "joign", label: "Joignabilité",
    test: function (n) { return n.indexOf("demande de rappel") >= 0 || n.indexOf("joignab") >= 0; } },
  { kind: "dmt", label: "Appels (DMT)",
    test: function (n) { return n.indexOf("ringover") >= 0 || (n.indexOf("appel") >= 0 && /\.csv$/i.test(n)); } }
];

function fsSupported() {
  return typeof window.showDirectoryPicker === "function";
}
function fsNormName(n) {
  return plNorm(String(n || ""));
}

/* ---------- IndexedDB : magasin « fslink » (une fiche « link ») ---------- */
function fsStoreTx(mode) {
  return idbTx(mode, "fslink");
}
function fsGetLink() {
  return fsStoreTx("readonly").then(function (st) {
    return new Promise(function (resolve, reject) {
      const rq = st.get(FS_KEY);
      rq.onsuccess = function () { resolve(rq.result || null); };
      rq.onerror = function () { reject(rq.error); };
    });
  }).catch(function () { return null; });
}
function fsSaveLink(rec) {
  return fsStoreTx("readwrite").then(function (st) {
    return new Promise(function (resolve, reject) {
      st.put(rec, FS_KEY);          /* magasin sans keyPath : clé explicite */
      st.transaction.oncomplete = function () { resolve(); };
      st.transaction.onerror = function () { reject(st.transaction.error); };
    });
  });
}
function fsClearLink() {
  return fsStoreTx("readwrite").then(function (st) {
    return new Promise(function (resolve, reject) {
      st.delete(FS_KEY);
      st.transaction.oncomplete = function () { resolve(); };
      st.transaction.onerror = function () { reject(st.transaction.error); };
    });
  });
}
/* Permission : « granted » (accès direct), « prompt » (il faut recliquer),
   « denied », « unsupported » (hors Chrome/Edge). */
function fsPermission(handle) {
  if (!handle || typeof handle.queryPermission !== "function") return Promise.resolve("unsupported");
  return handle.queryPermission({ mode: "read" }).catch(function () { return "denied"; });
}

/* ---------- Scan du dossier + imports via les fonctions existantes ---------- */
async function fsScan(handle, rec) {
  const report = { scanned: 0, imported: [], skipped: [], unknown: [], errors: [],
    when: new Date().toISOString() };
  rec.seen = rec.seen || {};
  for await (const entry of handle.values()) {
    if (!entry || entry.kind !== "file") continue;
    if (entry.name && entry.name.charAt(0) === "~") continue;   // fichiers temporaires Office
    report.scanned++;
    const n = fsNormName(entry.name);
    const m = FS_MATCHERS.find(function (x) { return x.test(n); });
    if (!m) {
      if (/\.(xls|xlsx|xlsb|xlsm|csv)$/i.test(entry.name) && report.unknown.length < 12) {
        report.unknown.push(entry.name);                          // fichier de données non reconnu
      }
      continue;
    }
    let file;
    try { file = await entry.getFile(); } catch (e) {
      report.errors.push(entry.name + " : fichier indisponible (OneDrive « à la demande » ? faites « Toujours conserver sur cet appareil »)");
      continue;
    }
    const sig = entry.name + "|" + (file.lastModified || 0);
    if (rec.seen[sig]) { report.skipped.push(entry.name); continue; }
    try {
      if (m.kind === "dmt") {
        const text = await file.text();
        const r = dmtImportFile(text, entry.name);
        if (r && r.ok === false) throw new Error(r.msg || "fichier non reconnu");
      } else if (m.kind === "planning") {
        await plImportFile(await file.arrayBuffer(), entry.name);
      } else {
        const r = await joignImportFile(await file.arrayBuffer(), entry.name);
        if (r && r.ok === false) throw new Error(r.msg || "fichier non reconnu");
      }
      report.imported.push(entry.name + " — " + m.label);
      rec.seen[sig] = true;
    } catch (e) {
      report.errors.push(entry.name + " : " + (e && e.message ? e.message : "lecture impossible"));
    }
  }
  rec.lastScan = report.when;
  rec.report = report;
  await fsSaveLink(rec);
  return report;
}

/* Résumé HTML du dernier scan (affiché dans la carte). */
function fsReportHtml(rep) {
  if (!rep) return "";
  let h = "";
  if (rep.imported.length) {
    h += '<div class="dmt-report"><b>Fichiers importés automatiquement</b><ul>' +
      rep.imported.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ul></div>";
  }
  if (rep.errors.length) {
    h += '<div class="dmt-report" style="border-left-color:#c0392b"><b>Erreurs</b><ul>' +
      rep.errors.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ul></div>";
  }
  const notes = [];
  if (rep.skipped.length) notes.push(rep.skipped.length + " fichier(s) déjà à jour (inchangé(s) depuis le dernier scan)");
  if (rep.unknown.length) notes.push("non reconnus : " + rep.unknown.slice(0, 4).join(", ") +
    (rep.unknown.length > 4 ? "…" : ""));
  if (notes.length) h += '<p class="note">' + esc(notes.join(" · ")) + "</p>";
  return h;
}

async function fsRefreshCard() {
  const el = $("#fsStatus");
  if (!el) return;
  const rec = await fsGetLink();
  const btnLink = $("#fsLinkBtn"), btnScan = $("#fsScanBtn"), btnUnlink = $("#fsUnlinkBtn"), repEl = $("#fsReport");
  if (!rec || !rec.handle) {
    el.innerHTML = "Aucun dossier lié pour le moment. Cliquez sur <b>Lier un dossier local</b> et choisissez votre dossier de bases.";
    if (btnScan) btnScan.style.display = "none";
    if (btnUnlink) btnUnlink.style.display = "none";
    if (repEl) repEl.innerHTML = "";
    return;
  }
  const perm = await fsPermission(rec.handle);
  const last = rec.lastScan ? new Date(rec.lastScan).toLocaleString("fr-FR") : null;
  let status = "<b>Dossier lié : " + esc(rec.name) + "</b>";
  if (last) status += " · dernier scan : " + esc(last);
  if (perm === "granted") {
    status += " · accès actif — le scan se fera automatiquement au démarrage.";
    if (btnScan) btnScan.style.display = "";
  } else if (perm === "prompt" || perm === "denied") {
    status += " · accès à réactiver : cliquez sur <b>Lier un dossier local</b> puis revalidez le même dossier (le navigateur redemande l'autorisation à chaque session sauf si « Autoriser à chaque visite » a été choisi).";
    if (btnScan) btnScan.style.display = "none";
  } else {
    status += " · accès non vérifiable ici.";
  }
  el.innerHTML = status;
  if (btnUnlink) btnUnlink.style.display = "";
  if (repEl) repEl.innerHTML = fsReportHtml(rec.report);
}

/* Choix du dossier : gère le premier lien ET la réactivation d'accès. */
async function fsPickAndScan() {
  if (!fsSupported()) return;
  let handle;
  try {
    handle = await window.showDirectoryPicker({ mode: "read" });
  } catch (e) {
    return;                                        // annulation utilisateur
  }
  const rec = (await fsGetLink()) || { key: FS_KEY, name: handle.name, handle: handle, seen: {} };
  rec.name = handle.name;
  rec.handle = handle;
  await fsSaveLink(rec);
  toast("Dossier « " + handle.name + " » lié — scan en cours…");
  const rep = await fsScan(handle, rec).catch(function () { return null; });
  await fsRefreshCard();
  if (rep && rep.imported.length) {
    toast(rep.imported.length + " fichier(s) importé(s) depuis « " + handle.name + " »");
    navigate();                                    // rafraîchit la page courante avec les nouvelles données
  }
}

function fsBindCard(root) {
  if (!fsSupported()) return;
  const btnLink = $("#fsLinkBtn"), btnScan = $("#fsScanBtn"), btnUnlink = $("#fsUnlinkBtn");
  if (btnLink) btnLink.addEventListener("click", fsPickAndScan);
  if (btnScan) btnScan.addEventListener("click", async function () {
    const rec = await fsGetLink();
    if (!rec || !rec.handle) return;
    const perm = await fsPermission(rec.handle);
    if (perm !== "granted" && typeof rec.handle.requestPermission === "function") {
      const p = await rec.handle.requestPermission({ mode: "read" }).catch(function () { return "denied"; });
      if (p !== "granted") { toast("Accès au dossier refusé."); return; }
    }
    toast("Scan de « " + rec.name + " »…");
    const rep = await fsScan(rec.handle, rec).catch(function () { return null; });
    await fsRefreshCard();
    if (rep && rep.imported.length) { toast(rep.imported.length + " fichier(s) importé(s)"); navigate(); }

/* Scan automatique au démarrage (si l'accès a été accordé durablement). */
async function fsAutoScan() {
  if (!fsSupported()) return;
  try {
    const rec = await fsGetLink();
    if (!rec || !rec.handle) return;
    const perm = await fsPermission(rec.handle);
    if (perm !== "granted") return;
    const rep = await fsScan(rec.handle, rec);

/* ============================================================
   BASE CENTRALE CLOUDFLARE D1 (fonction Pages /api)
   Synchronisation facultative : tant que le backend n'est pas
   déployé (guide DEPLOY-D1.md), la carte reste sur « non
   installée » et l'outil fonctionne comme d'habitude en local.
   Quand elle est déployée : « Envoyer » pousse la base complète
   du navigateur vers D1, « Récupérer » remplace la base locale
   par celle du serveur — tout le monde voit alors les mêmes
   chiffres, depuis n'importe quel appareil.
   ============================================================ */
function syncApiKey() {
  try { return localStorage.getItem("bo_api_key") || ""; } catch (e) { return ""; }
}
function syncHeaders() {
  const h = { "Content-Type": "application/json;charset=utf-8" };
  const k = syncApiKey();
  if (k) h["X-App-Key"] = k;
  return h;
}
/* Détection : renvoie { ok:true, counts... } si la fonction /api répond, sinon { ok:false }. */
async function syncState() {
  try {
    const r = await fetch("/api/state", { headers: syncHeaders() });
    const ct = r.headers.get("content-type") || "";
    if (ct.indexOf("application/json") < 0) return { ok: false, status: r.status };
    const j = await r.json().catch(function () { return null; });
    if (!j) return { ok: false, status: r.status };
    if (!r.ok || j.ok === false) return { ok: false, status: r.status, error: j.error || "erreur serveur" };
    return Object.assign({ ok: true }, j);
  } catch (e) {
    return { ok: false, status: 0 };
  }
}
/* Charge utile d'envoi : même contenu que la sauvegarde JSON v3 (tout, IDB compris). */
async function syncBuildPayload() {
  const res = await Promise.all([plAllWeeks(), idbAllRows()]);
  return {
    app: "boite-outils-superviseur", version: 3, exported: new Date().toISOString(),
    activityId: store.data.activityId, entries: store.data.entries, fdr: store.data.fdr,
    dmt: store.data.dmt, satcli: store.data.satcli, joign: store.data.joign,
    planning: res[0], joignRaw: res[1]
  };
}
async function syncPush() {
  const payload = await syncBuildPayload();
  const r = await fetch("/api/push", { method: "POST", headers: syncHeaders(), body: JSON.stringify(payload) });
  const j = await r.json().catch(function () { return { ok: false, error: "réponse illisible" }; });
  return j;
}
async function syncPull() {
  const r = await fetch("/api/pull", { headers: syncHeaders() });
  const ct = r.headers.get("content-type") || "";
  if (!r.ok || ct.indexOf("application/json") < 0) return { ok: false, error: "serveur indisponible" };
  return r.json();
}

/* Restauration d'une base complète (sauvegarde JSON v3, réponse /api/pull) :
   localStorage + les deux magasins IndexedDB. Utilisée par l'import de
   sauvegarde ET par « Récupérer depuis le serveur ». */
function syncApplyDump(d, doneMsg) {
  if (!d || !Array.isArray(d.entries)) {
    toast("Données invalides.");
    return Promise.resolve(false);
  }
  const entries = d.entries.filter(function (e) { return e && Array.isArray(e.row) && e.row.length === 54; });
  const plList = Array.isArray(d.planning) ? d.planning.filter(function (r) { return r && r.week; }) : null;
  const rawList = Array.isArray(d.joignRaw) ? d.joignRaw.filter(Boolean) : null;
  store.data.entries = entries;
  if (d.activityId) store.data.activityId = d.activityId;
  if (Array.isArray(d.fdr)) {
    const fdr = d.fdr.filter(function (r) { return r && r.fluxId && Array.isArray(r.v) && r.v.length === 8; });
    if (fdr.length) store.data.fdr = fdr;
  }
  if (d.dmt) store.data.dmt = {
    matricules: d.dmt.matricules || {},
    agg: d.dmt.agg || {},
    imports: Array.isArray(d.dmt.imports) ? d.dmt.imports : []
  };
  if (d.satcli && d.satcli.vals) store.data.satcli = { vals: d.satcli.vals, dates: d.satcli.dates || {} };
  if (d.joign && d.joign.agg) store.data.joign = {
    agg: d.joign.agg,
    imports: Array.isArray(d.joign.imports) ? d.joign.imports : [],
    total: d.joign.total || 0
  };
  store.save();
  store.recalcAll();
  const idbJobs = [];
  if (plList) {
    idbJobs.push(idbClearStore("planning").then(function () {
      return Promise.all(plList.map(function (rec) { return plPutWeek(rec); }));
    }));
  }
  if (rawList) idbJobs.push(idbClear().then(function () { return idbPutRows(rawList); }));
  return Promise.all(idbJobs).then(function () {
    toast(doneMsg);
    navigate();
    return true;
  }).catch(function () {
    toast("Données principales restaurées (IndexedDB indisponible).");
    navigate();
    return true;
  });
}

      await syncApplyDump(d.dump, "Base centrale récupérée automatiquement (" + d.dump.entries.length + " lignes).");
    }
  } catch (e) { /* silencieux : ne doit jamais bloquer le démarrage */ }
}

</script>
