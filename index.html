"use strict";
/* ============================================================
   Lecteur XLSX pour navigateur (aucune dépendance externe).
   Un fichier .xlsx est une archive ZIP : on lit le répertoire
   central, on décompresse la feuille 1 et les chaînes partagées
   avec DecompressionStream("deflate-raw") (Chrome/Edge/Firefox
   modernes), puis on parcourt le XML ligne par ligne.
   Ne charge en mémoire que les lignes réellement renseignées.
   ============================================================ */

/* ---------- Décompression ZIP ---------- */
function xlsxU16(b, o) { return b[o] | (b[o + 1] << 8); }
function xlsxU32(b, o) {
  return (b[o] | (b[o + 1] << 8) | (b[o + 2] << 16) | (b[o + 3] << 24)) >>> 0;
}
async function xlsxInflate(bytes) {
  if (typeof DecompressionStream === "undefined") {
    throw new Error("Votre navigateur est trop ancien pour lire les fichiers .xlsx (use Chrome récent).");
  }
  const ds = new DecompressionStream("deflate-raw");
  const stream = new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
/* Lit le répertoire central du ZIP : [{name, method, csize, lho}] */
function xlsxEntries(b) {
  let e = -1;
  const min = Math.max(0, b.length - 22 - 65557);
  for (let i = b.length - 22; i >= min; i--) {
    if (b[i] === 0x50 && b[i + 1] === 0x4b && b[i + 2] === 0x05 && b[i + 3] === 0x06) { e = i; break; }
  }
  if (e < 0) throw new Error("Archive ZIP illisible (fichier .xlsx corrompu ?).");
  const n = xlsxU16(b, e + 10);
  let off = xlsxU32(b, e + 16);
  const out = [];
  for (let i = 0; i < n; i++) {
    if (xlsxU32(b, off) !== 0x02014b50) break;
    const method = xlsxU16(b, off + 10);
    const csize = xlsxU32(b, off + 20);
    const nlen = xlsxU16(b, off + 28);
    const elen = xlsxU16(b, off + 30);
    const clen = xlsxU16(b, off + 32);
    const lho = xlsxU32(b, off + 42);
    let name = "";
    for (let j = 0; j < nlen; j++) name += String.fromCharCode(b[off + 46 + j]);
    out.push({ name: name, method: method, csize: csize, lho: lho });
    off += 46 + nlen + elen + clen;
  }
  return out;
}
async function xlsxEntry(b, entries, wanted) {
  const ent = entries.find(function (x) { return x.name === wanted; });
  if (!ent) throw new Error("Élément « " + wanted + " » absent du fichier .xlsx.");
  const nlen = xlsxU16(b, ent.lho + 26);
  const elen = xlsxU16(b, ent.lho + 28);
  const start = ent.lho + 30 + nlen + elen;
  const data = b.subarray(start, start + ent.csize);
  if (ent.method === 0) return data;
  if (ent.method === 8) return xlsxInflate(data);
  throw new Error("Compression ZIP non prise en charge (méthode " + ent.method + ").");
}
function xlsxDecode(bytes) { return new TextDecoder("utf-8").decode(bytes); }

/* ---------- XML minimal ---------- */
function xmlUnesc(s) {
  return String(s)
    .replace(/&#x([0-9a-fA-F]+);/g, function (_, h) { return String.fromCodePoint(parseInt(h, 16)); })
    .replace(/&#(\d+);/g, function (_, d) { return String.fromCodePoint(parseInt(d, 10)); })
    .replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&lt;/g, "<")
    .replace(/&gt;/g, ">").replace(/&amp;/g, "&");
}
/* Chaînes partagées : tableau de textes (concaténation des <t> de chaque <si>) */
function xlsxSharedStrings(xml) {
  const out = [];
  const re = /<si(?:\s[^>]*)?>([\s\S]*?)<\/si>/g;
  const tre = /<t[^>]*>([\s\S]*?)<\/t>/g;
  let m;
  while ((m = re.exec(xml)) !== null) {
    let txt = "";
    let t;
    tre.lastIndex = 0;
    while ((t = tre.exec(m[1])) !== null) txt += t[1];
    out.push(xmlUnesc(txt));
  }
  return out;
}
function xlsxColIdx(letters) {
  let n = 0;
  for (let i = 0; i < letters.length; i++) n = n * 26 + (letters.charCodeAt(i) - 64);
  return n - 1;
}
/* Numéro de série Excel (jours depuis le 30/12/1899) -> "AAAA-MM-JJ" */
function xlsxSerialToDay(n) {
  const d = new Date(Math.floor(n - 25569) * 86400000);
  if (isNaN(d.getTime())) return null;
  return d.toISOString().slice(0, 10);
}
function xlsxYield() { return new Promise(function (r) { setTimeout(r, 0); }); }

/* ---------- Lecture de la feuille ----------
   Retourne { header: [noms], rows: [[valeurs]] } avec uniquement les
   lignes ayant au moins une cellule renseignée dans les colonnes utiles. */
async function xlsxReadFirstSheet(arrayBuffer, maxCols) {
  const NC = maxCols || 23;
  const b = new Uint8Array(arrayBuffer);
  const entries = xlsxEntries(b);
  const sheetBytes = await xlsxEntry(b, entries, "xl/worksheets/sheet1.xml");
  const sheetXml = xlsxDecode(sheetBytes);
  const sharedBytes = await xlsxEntry(b, entries, "xl/sharedStrings.xml");
  const shared = xlsxSharedStrings(xlsxDecode(sharedBytes));

  const RE_CELL = /<c\s+([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g;
  const rows = [];
  let header = null, headerRowIdx = -1;
  const RE_ROW = /<row(?:[^>]*\/>|[^>]*>[\s\S]*?<\/row>)/g;
  let m, processed = 0, lastYield = 0;
  while ((m = RE_ROW.exec(sheetXml)) !== null) {
    processed++;
    if (processed - lastYield > 100000) {                     // garde l'interface réactive
      lastYield = processed;
      await xlsxYield();
    }
    const rowStr = m[0];
    if (rowStr.indexOf("<c ") < 0) continue;                 // ligne vide (<row r=".."/>)
    const cells = [];
    let cm;
    RE_CELL.lastIndex = 0;
    let hasVal = false;
    while ((cm = RE_CELL.exec(rowStr)) !== null) {
      const attrs = cm[1], body = cm[2];
      if (body === undefined) continue;                      // cellule de style sans valeur
      const rm = /r="([A-Z]+)\d+"/.exec(attrs);
      if (!rm) continue;
      const ci = xlsxColIdx(rm[1]);
      if (ci >= NC) continue;
      let v = "";
      if ((/\st="s"/).test(attrs)) {
        const vm = /<v(?:\s[^>]*)?>([\s\S]*?)<\/v>/.exec(body);
        v = vm ? (shared[parseInt(vm[1], 10)] || "") : "";
      } else if ((/\st="inlineStr"/).test(attrs)) {
        let txt = "";
        const tre = /<t[^>]*>([\s\S]*?)<\/t>/g;
        let tm;
        while ((tm = tre.exec(body)) !== null) txt += tm[1];
        v = xmlUnesc(txt);
      } else {
        const vm = /<v(?:\s[^>]*)?>([\s\S]*?)<\/v>/.exec(body);
        v = vm ? xmlUnesc(vm[1]) : "";
      }
      if (v !== "") hasVal = true;
      cells[ci] = v;
    }
    if (!hasVal) continue;
    if (!header) {
      const first = [];
      for (let i = 0; i < NC; i++) first.push((cells[i] || "").trim());
      if (!first.join("")) continue;                          // ligne sans contenu en colonne A-L
      header = first;
      headerRowIdx = processed;
      continue;                                               // la ligne d'en-tête n'est pas une donnée
    }
    rows.push(cells);
  }
  if (!header) throw new Error("Aucune ligne d'en-tête trouvée dans la feuille 1.");
  return { header: header, rows: rows };
}

"use strict";
/* ============================================================
   STYCH — Taux de joignabilité (indicateur « Demande de rappel »).
   Source : fichier .xlsx « Demande de rappel » (colonnes Agent,
   Date, Créneau, ID contact, Décroché, Statut…), importé depuis la
   page Alimentation DATA. Formule : clients joints ÷ clients appelés
   (Décroché OUI ÷ (OUI + NON)) ; les lignes sans Décroché sont exclues.
   Objectif : 80 % (modifiable ci-dessous).
   Conservation : TOUTES les colonnes sont gardées en IndexedDB
   (base « bo-sup » / magasin « rappel ») pour l'analyse et les usages
   futurs ; l'agrégat jour + agent (OUI/NON) vit dans la base locale
   de l'outil (localStorage) pour la Scorecard.
   ============================================================ */

const JOIGN_OBJECTIF = 0.8;   // 80 % — objectif de taux de joignabilité
const JOIGN_LABEL = "Taux de joignabilité";

/* Équipe joignabilité = équipe SATCLI + Alain (présent uniquement dans
   le fichier Demande de rappel). Joseph = Marie Joseph (même personne). */
const JOIGN_AGENTS = SATCLI_AGENTS.concat([
  { key: "alain", nom: "Alain", matricule: "" }
]);
const JOIGN_MATCH = {};
(function () {
  const noms = {
    fanyah: ["fanyah"],
    mariej: ["marie joseph", "joseph", "marie joseph ardinkwa", "ardinkwa"],
    thanjhi: ["than-jhi", "thanjhi", "marolahy"],
    michou: ["michou", "levy"],
    anna: ["anna", "marie anna"],
    tojo: ["tojo"],
    josie: ["josie"],
    tahina: ["tahina"],
    mamy: ["nirintsoa", "mamy"],
    alain: ["alain"]
  };
  Object.keys(noms).forEach(function (k) {
    noms[k].forEach(function (n) { JOIGN_MATCH[joignNorm(n)] = k; });
  });
})();

function joignNorm(s) {
  return dmtNorm(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}
function joignKey(nom) { return JOIGN_MATCH[joignNorm(nom)] || null; }

/* ---------- Base locale (agrégat jour + agent) ---------- */
function joignStore() {
  if (!store.data.joign) store.data.joign = { agg: {}, imports: [], total: 0 };
  if (!store.data.joign.agg) store.data.joign.agg = {};
  if (!store.data.joign.imports) store.data.joign.imports = [];
  return store.data.joign;
}

/* ---------- IndexedDB : lignes brutes conservées ---------- */
function idbOpen() {
  return new Promise(function (resolve, reject) {
    /* v3 : ajout du magasin « fslink » (dossier local lié, fslink.js) */
    const req = indexedDB.open("bo-sup", 3);
    req.onupgradeneeded = function () {
      const db = req.result;
      if (!db.objectStoreNames.contains("rappel")) {
        db.createObjectStore("rappel", { autoIncrement: true });
      }
      if (!db.objectStoreNames.contains("planning")) {
        db.createObjectStore("planning", { keyPath: "week" });
      }
      if (!db.objectStoreNames.contains("fslink")) {
        db.createObjectStore("fslink");
      }
    };
    req.onsuccess = function () { resolve(req.result); };
    req.onerror = function () { reject(req.error); };
  });
}
function idbTx(mode, store) {
  return idbOpen().then(function (db) {
    return db.transaction(store || "rappel", mode).objectStore(store || "rappel");
  });
}
function idbClear() {
  return idbTx("readwrite").then(function (st) {
    return new Promise(function (resolve, reject) {
      const rq = st.clear();
      rq.onsuccess = function () { resolve(); };
      rq.onerror = function () { reject(rq.error); };
    });
  });
}
/* Vide n'importe quel magasin de la base (ex : « planning »). */
function idbClearStore(storeName) {
  return idbTx("readwrite", storeName).then(function (st) {
    return new Promise(function (resolve, reject) {
      const rq = st.clear();
      rq.onsuccess = function () { resolve(); };
      rq.onerror = function () { reject(rq.error); };
    });
  });
}
function idbPutRows(rows) {
  return idbTx("readwrite").then(function (st) {
    return new Promise(function (resolve, reject) {
      for (let i = 0; i < rows.length; i++) st.put(rows[i]);
      const tx = st.transaction;
      tx.oncomplete = function () { resolve(); };
      tx.onerror = function () { reject(tx.error); };
    });
  });
}
function idbAllRows() {
  return idbTx("readonly").then(function (st) {
    return new Promise(function (resolve, reject) {
      const rq = st.getAll();
      rq.onsuccess = function () { resolve(rq.result || []); };
      rq.onerror = function () { reject(rq.error); };
    });
  });
}
function idbCount() {
  return idbTx("readonly").then(function (st) {
    return new Promise(function (resolve, reject) {
      const rq = st.count();
      rq.onsuccess = function () { resolve(rq.result); };
      rq.onerror = function () { reject(rq.error); };
    });
  });
}

/* ---------- Import du fichier .xlsx « Demande de rappel » ----------
   Chaque import REMPLACE la base (le fichier est un export complet) :
   IndexedDB purgé puis re-rempli avec toutes les colonnes, agrégat
   jour + agent recalculé pour la Scorecard. */
function joignDayOf(v) {
  const s = String(v).trim();
  if (!s) return null;
  if (/^\d+(\.\d+)?$/.test(s)) {                              // numéro de série Excel
    const n = parseFloat(s);
    return n >= 20000 && n <= 80000 ? xlsxSerialToDay(n) : null;
  }
  return dmtDayOf(s);
}
function joignImportFile(arrayBuffer, fileName) {
  return xlsxReadFirstSheet(arrayBuffer, 12).then(function (wb) {
    const hdr = wb.header.map(function (h) { return joignNorm(h); });
    const col = function (name) { return hdr.indexOf(name); };
    const iAgent = col("agent"), iDate = col("date"), iDec = col("decroche");
    const iCre = col("creneau"), iId = col("id contact"), iVoie = col("voix/chat");
    const iStatut = col("statut"), iSec = col("secteur"), iTic = col("ticket/demande de rappel");
    const iRais = col("raisons d'echanges"), iCom = col("commentaire"), iPa = col("personne assignee");
    const missing = ["agent", "date", "decroche"].filter(function (n) { return col(n) < 0; });
    if (missing.length) {
      return { ok: false, msg: "Colonne(s) " + missing.join(", ") + " non trouvée(s). Colonnes vues : " +
        wb.header.join(", ").slice(0, 220) };
    }
    const v = function (r, i) { return (r[i] === undefined || r[i] === null) ? "" : String(r[i]).trim(); };
    const agg = {};
    const statutCount = {};
    const raw = [];
    const ignores = {};
    let lignes = 0, imputes = 0, sansDate = 0, sansDec = 0;
    wb.rows.forEach(function (r) {
      lignes++;
      const nom = v(r, iAgent);
      const key = nom ? joignKey(nom) : null;
      if (!key) { ignores[nom || "(sans agent)"] = (ignores[nom || "(sans agent)"] || 0) + 1; return; }
      const day = joignDayOf(v(r, iDate));
      if (!day) { sansDate++; return; }
      const dec = v(r, iDec).toUpperCase();
      if (dec !== "OUI" && dec !== "NON") { sansDec++; return; }
      imputes++;
      const stv = v(r, iStatut);
      statutCount[stv] = (statutCount[stv] || 0) + 1;
      raw.push({
        a: key, d: day, dc: dec,
        c: v(r, iCre), i: v(r, iId), v: v(r, iVoie), st: stv,
        sec: v(r, iSec), tic: v(r, iTic), r: v(r, iRais), com: v(r, iCom), pa: v(r, iPa)
      });
      const k = key + "|" + day;
      if (!agg[k]) agg[k] = { oui: 0, non: 0 };
      if (dec === "OUI") agg[k].oui++; else agg[k].non++;
    });
    if (!imputes) {
      return { ok: false, msg: "Aucun appel de l'équipe dans ce fichier (" + lignes + " ligne(s) lue(s))." };
    }
    return idbClear().then(function () {
      return idbPutRows(raw);
    }).then(function () {
      const st = joignStore();
      const report = { ok: true, file: fileName, when: new Date().toISOString(),
        lignes: lignes, imputes: imputes, ignores: ignores, sansDate: sansDate,
        sansDecroche: sansDec, maj: Object.keys(agg).length, remp: Object.keys(st.agg).length,
        total: raw.length, remplace: true };
      st.agg = agg;
      st.total = raw.length;
      st.statuts = statutCount;   /* effectifs par statut : options du filtre de l'analyse */
      st.imports.unshift(report);
      if (st.imports.length > 10) st.imports.length = 10;
      store.save();
      return report;
    });
  });
}

/* ---------- Lectures de la base (agrégat) ---------- */
function joignMonths() {
  const set = {};
  Object.keys(joignStore().agg).forEach(function (k) { set[k.split("|")[1].slice(0, 7)] = 1; });
  return Object.keys(set).sort();
}
function joignDays(moisList) {
  const set = {};
  Object.keys(joignStore().agg).forEach(function (k) {
    const d = k.split("|")[1];
    if (!moisList || !moisList.length || moisList.indexOf(d.slice(0, 7)) >= 0) set[d] = 1;
  });
  return Object.keys(set).sort();
}
/* Joignabilité d'un agent sur la période : joints ÷ appelés (OUI ÷ (OUI+NON)). */
function joignAgentPeriod(agentKey, moisList, jourList) {
  let oui = 0, non = 0;
  const agg = joignStore().agg;
  Object.keys(agg).forEach(function (k) {
    const p = k.split("|");
    if (p[0] !== agentKey) return;
    const d = p[1];
    if (moisList && moisList.length && moisList.indexOf(d.slice(0, 7)) < 0) return;
    if (jourList && jourList.length && jourList.indexOf(d) < 0) return;
    oui += agg[k].oui;
    non += agg[k].non;
  });
  const t = oui + non;
  return t ? { oui: oui, non: non, total: t, taux: oui / t } : null;
}
/* Joignabilité projet = moyenne des taux des agents ayant des appels
   sur la période (même logique que DMT et SATCLI). */
function joignProjectPeriod(moisList, jourList, agentKeys) {
  let sum = 0, c = 0, n = 0;
  JOIGN_AGENTS.forEach(function (a) {
    if (agentKeys && agentKeys.length && agentKeys.indexOf(a.key) < 0) return;
    const p = joignAgentPeriod(a.key, moisList, jourList);
    if (p) { sum += p.taux; c++; n += p.total; }
  });
  return c ? { taux: sum / c, agents: c, n: n } : null;
}
function joignAgentClass(v) {
  return v === null ? "dim" : (v >= JOIGN_OBJECTIF ? "dmt-ok" : "dmt-ko");
}
/* Légende du graphique (réutilisée dans la Scorecard et l'Analyse) */
function joignLegendHtml() {
  return '<div class="dmt-legend">' +
    '<span><i style="background:var(--jade)"></i>Objectif atteint (' + fmtFr(JOIGN_OBJECTIF * 100, 0) + " % ou plus)</span>" +
    '<span><i style="background:var(--raspberry)"></i>Sous l\'objectif</span>' +
    '<span><i style="background:none;border-top:2px dashed var(--raspberry);height:0;width:18px;border-radius:0"></i>Ligne objectif ' +
    fmtFr(JOIGN_OBJECTIF * 100, 0) + " %</span>" +
    "</div>";
}

/* Légende du graphique combiné de l'analyse (barres volume + courbe taux) */
function joignLegendComboHtml() {
  return '<div class="dmt-legend">' +
    '<span><i style="background:var(--jade);opacity:.85"></i>Contacts traités (appels)</span>' +
    '<span><i style="background:var(--raspberry);border-radius:50%"></i>Taux de joignabilité (échelle de droite, 0 à 100 %)</span>' +
    "</div>";
}

/* Graphique combiné de l'analyse : barres = contacts traités (p.n),
   courbe = taux de joignabilité (p.value) sur une échelle 0-100 %.
   Pas de ligne d'objectif (demande de l'équipe). */
function joignComboSvg(series, w) {
  const W = w || 820, H = 250, padL = 46, padR = 44, padT = 28, padB = 36;
  const iw = W - padL - padR, ih = H - padT - padB;
  const maxN = Math.max.apply(null, series.map(function (p) { return p.n || 0; }).concat([0]));
  const maxBars = Math.max(maxN * 1.15, 1);
  const yB = function (n) { return padT + ih - Math.max(0, (n / maxBars) * ih); };
  const yT = function (t) { return padT + ih - (t / 100) * ih; };
  const parts = [];
  [0, maxBars / 2, maxBars].forEach(function (v) {
    parts.push('<line x1="' + padL + '" y1="' + yB(v).toFixed(1) + '" x2="' + (W - padR) +
      '" y2="' + yB(v).toFixed(1) + '" stroke="var(--border)" stroke-width="1"/>');
    parts.push('<text x="' + (padL - 8) + '" y="' + (yB(v) + 4).toFixed(1) +
      '" text-anchor="end" font-size="11" fill="var(--dim)">' + fmtFr(v, 0) + "</text>");
  });
  parts.push('<text x="' + (padL - 8) + '" y="' + (padT - 14) + '" text-anchor="end" font-size="10.5" fill="var(--dim)">n</text>');
  [0, 50, 100].forEach(function (t) {
    parts.push('<text x="' + (W - padR + 6) + '" y="' + (yT(t) + 4).toFixed(1) +
      '" font-size="11" fill="var(--raspberry)">' + t + " %</text>");
  });
  const slot = iw / Math.max(series.length, 1);
  const bw = Math.min(44, slot * 0.62);
  const every = Math.ceil(series.length / 17);
  const valEvery = Math.max(1, Math.ceil(30 / slot));
  const txEvery = Math.max(1, Math.ceil(46 / slot));   /* espacement des étiquettes de taux */
  let path = "", pen = false;
  series.forEach(function (p, i) {
    const cx = padL + slot * i + slot / 2;
    if (p.value !== null) {
      path += (pen ? " L" : " M") + cx.toFixed(1) + " " + yT(p.value * 100).toFixed(1);
      pen = true;
    } else {
      pen = false;
    }
  });
  if (path) {
    parts.push('<path d="' + path + '" fill="none" stroke="var(--raspberry)" stroke-width="2.5"/>');
  }
  series.forEach(function (p, i) {
    const x = padL + slot * i + (slot - bw) / 2;
    const cx = x + bw / 2;
    const tip = esc(p.full + " : " + fmtFr(p.n, 0) + " contact(s) traité(s) — taux " +
      (p.value === null ? "—" : fmtFr(p.value * 100, 1) + " %") + ", " + p.agents + " agent(s)");
    if (p.n > 0) {
      const h = Math.max(2, padT + ih - yB(p.n));
      parts.push('<rect x="' + x.toFixed(1) + '" y="' + yB(p.n).toFixed(1) +
        '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="4" fill="var(--jade)" opacity="0.85">' +
        "<title>" + tip + "</title></rect>");
      if (i % valEvery === 0) {
        /* Si un point de la courbe recouvre l'étiquette du sommet de barre,
           l'étiquette passe à l'intérieur de la barre (blanc). */
        const lblY = yB(p.n) - 5;
        const hb = padT + ih - yB(p.n);
        const py = p.value !== null ? yT(p.value * 100) : null;
        const clash = py !== null && Math.abs(py - lblY) < 13;
        let ty = lblY, fill = "var(--midnight)";
        if (clash && hb >= 22) { ty = yB(p.n) + 15; fill = "#fff"; }
        else if (clash) { ty = py - 12; }
        parts.push('<text x="' + cx.toFixed(1) + '" y="' + ty.toFixed(1) +
          '" text-anchor="middle" font-size="10.5" font-weight="700" fill="' + fill + '">' +
          fmtFr(p.n, 0) + "</text>");
      }
    } else {
      parts.push('<text x="' + cx.toFixed(1) + '" y="' + (padT + 12) +
        '" text-anchor="middle" font-size="10.5" fill="var(--dim)">0</text>');
    }
    if (p.value !== null) {
      const py = yT(p.value * 100);
      parts.push('<circle cx="' + cx.toFixed(1) + '" cy="' + py.toFixed(1) +
        '" r="3" fill="var(--raspberry)"><title>' + tip + "</title></circle>");
      /* Étiquette du taux sur chaque point de la courbe : au-dessus du point,
         en dessous si on touche le haut du cadre ou si l'étiquette de barre
         décalée (barre minuscule) occupe la place au-dessus. Halo blanc pour
         rester lisible même quand le point est sur une barre. */
      if (i % txEvery === 0) {
        let ty = py - 8;
        const barLblAbove = i % valEvery === 0 && p.n > 0 &&
          Math.abs(py - (yB(p.n) - 5)) < 13 && (padT + ih - yB(p.n)) < 22;
        if (ty < padT + 2 || barLblAbove) ty = py + 16;
        parts.push('<text x="' + cx.toFixed(1) + '" y="' + ty.toFixed(1) +
          '" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--raspberry)" ' +
          'paint-order="stroke" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">' +
          fmtFr(p.value * 100, 1) + " %</text>");
      }
    }
    if (i % every === 0) {
      parts.push('<text x="' + cx.toFixed(1) + '" y="' + (H - 14) +
        '" text-anchor="middle" font-size="10.5" fill="var(--dim)">' + esc(p.label) + "</text>");
    }
  });
  return '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Contacts traités et taux de joignabilité">' +
    parts.join("") + "</svg>";
}

/* ---------- Série du graphique (comme scSeries pour la DMT) ---------- */
function joignSeries() {
  const effMonths = scState.mois.length ? scState.mois : joignMonths();
  if (effMonths.length === 1) {
    const mo = effMonths[0];
    const allDays = joignDays([mo]);
    const days = scState.jour.length ? allDays.filter(function (d) { return scState.jour.indexOf(d) >= 0; }) : allDays;
    return { granularite: "par jour",
      points: days.map(function (d) {
        const p = joignProjectPeriod([mo], [d], scState.agent);
        return { label: String(parseInt(d.slice(8, 10), 10)), value: p ? p.taux : null,
          n: p ? p.n : 0, agents: p ? p.agents : 0, full: dmtDayLabel(d) };
      }) };
  }
  return { granularite: "par mois",
    points: effMonths.map(function (mo) {
      const joursDuMois = scState.jour.filter(function (d) { return d.slice(0, 7) === mo; });
      const p = joignProjectPeriod([mo], joursDuMois, scState.agent);
      const mm = parseInt(mo.slice(5, 7), 10) - 1;
      const full = MONTHS[mm] || mo;
      return { label: DASH_MOIS_SHORT[full] || full.slice(0, 3), value: p ? p.taux : null,
        n: p ? p.n : 0, agents: p ? p.agents : 0, full: full + " " + mo.slice(0, 4) };
    }) };
}

/* ---------- Graphique SVG (barres % + ligne objectif) ---------- */
function joignChartSvg(series, w) {
  const W = w || 820, H = 250, padL = 46, padR = 14, padT = 28, padB = 36;
  const iw = W - padL - padR, ih = H - padT - padB;
  const obj = JOIGN_OBJECTIF * 100;
  const withVal = series.filter(function (p) { return p.value !== null; });
  const maxData = Math.max.apply(null, withVal.map(function (p) { return p.value * 100; }).concat([0]));
  const maxV = Math.min(100, Math.max(obj * 1.15, maxData * 1.15, 60));
  const y = function (v) { return padT + ih - (v / maxV) * ih; };
  const parts = [];
  [0, obj, maxV].forEach(function (v, i) {
    parts.push('<line x1="' + padL + '" y1="' + y(v).toFixed(1) + '" x2="' + (W - padR) +
      '" y2="' + y(v).toFixed(1) + '" stroke="' + (i === 1 ? "var(--raspberry)" : "var(--border)") +
      '" stroke-width="1" ' + (i === 1 ? 'stroke-dasharray="6 4"' : "") + '/>');
    parts.push('<text x="' + (padL - 8) + '" y="' + (y(v) + 4).toFixed(1) +
      '" text-anchor="end" font-size="11" fill="var(--dim)">' + Math.round(v) + "</text>");
  });
  parts.push('<text x="' + (padL - 8) + '" y="' + (padT - 14) + '" text-anchor="end" font-size="10.5" fill="var(--dim)">%</text>');
  parts.push('<text x="' + (W - padR) + '" y="' + (y(obj) - 6).toFixed(1) +
    '" text-anchor="end" font-size="11" font-weight="700" fill="var(--raspberry)">Objectif ' +
    fmtFr(obj, 0) + " %</text>");
  const slot = iw / Math.max(series.length, 1);
  const bw = Math.min(44, slot * 0.62);
  const every = Math.ceil(series.length / 17);
  /* Étiquettes de valeur : une tous les ~30 px quand les barres sont serrées
     (sinon elles se chevauchent) ; toutes les valeurs restent en tooltip. */
  const valEvery = Math.max(1, Math.ceil(30 / slot));
  series.forEach(function (p, i) {
    const x = padL + slot * i + (slot - bw) / 2;
    if (p.value !== null) {
      const val = p.value * 100;
      const h = Math.max(2, ih - (val / maxV) * ih);
      const col = val >= obj ? "var(--jade)" : "var(--raspberry)";
      parts.push('<rect x="' + x.toFixed(1) + '" y="' + (padT + ih - h).toFixed(1) +
        '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="4" fill="' + col + '">' +
        "<title>" + esc(p.full + " : " + fmtFr(val, 1) + " % — " + p.n + " appel(s), " +
        p.agents + " agent(s)") + "</title></rect>");
      if (i % valEvery === 0) {
        parts.push('<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (padT + ih - h - 5).toFixed(1) +
          '" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--midnight)">' +
          fmtFr(val, 1) + "</text>");
      }
    } else {
      parts.push('<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (padT + 12) +
        '" text-anchor="middle" font-size="10.5" fill="var(--dim)">—</text>');
    }
    if (i % every === 0) {
      parts.push('<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 14) +
        '" text-anchor="middle" font-size="10.5" fill="var(--dim)">' + esc(p.label) + "</text>");
    }
  });
  return '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + JOIGN_LABEL +
    ' du projet, objectif ' + fmtFr(obj, 0) + ' %">' + parts.join("") + "</svg>";
}

      "<li>Toutes les colonnes sont conservées (" + last.total + " ligne(s) en base) — agrégat jour + agent recalculé.</li>" +
      (ignKeys.length

            return esc(k) + " (" + last.ignores[k] + ")";
          }).join(", ") + "</li>"
        : "") +
      (last.sansDate ? "<li>" + last.sansDate + " ligne(s) sans date exploitable ignorée(s).</li>" : "") +
      (last.sansDecroche ? "<li>" + last.sansDecroche + " ligne(s) sans Décroché exclue(s) du calcul.</li>" : "") +

    '<div class="chip">Lignes jour + agent<b>' + Object.keys(st.agg).length + "</b></div>" +
    '<div class="chip">Période couverte<b>' + (months.length ? dmtMonthLabel(months[0]) + " au " + dmtMonthLabel(months[months.length - 1]) : "—") + "</b></div>" +

    "</div>" +
    '<div class="form-actions">' +
    '<button type="button" class="btn btn-ghost btn-sm" id="joignOpenScore">' + ic("grid", 15) + " Ouvrir la Scorecard</button>" +
    '<button type="button" class="btn btn-ghost btn-sm" id="joignOpenAnalyse">' + ic("trend", 15) + " Ouvrir l'Analyse</button>" +
    '<button type="button" class="btn btn-danger btn-sm" id="joignWipe">' + ic("trash", 14) + " Vider les données</button></div></div>";

  root.innerHTML = html;

    const file = this.files[0];
    if (!file) return;
    toast("Lecture du fichier en cours… (quelques secondes)");
    const reader = new FileReader();
    reader.onload = function () {
      joignImportFile(reader.result, file.name).then(function (rep) {
        if (!rep.ok) toast("Import impossible : " + rep.msg);
        else toast("Import réussi : " + rep.imputes + " appel(s) pris en compte, base remplacée.");
        renderStychAlim(document.querySelector("#main"));
      }).catch(function (err) {
        toast("Import impossible : " + (err && err.message ? err.message : "erreur inconnue"));
      });
    };
    reader.onerror = function () { toast("Lecture du fichier impossible."); };

  $("#joignOpenAnalyse").addEventListener("click", function () { location.hash = "#/analyse"; });
  $("#joignWipe").addEventListener("click", function () {
    const st2 = joignStore();
    if (!st2.total && !st2.imports.length) { toast("Les données de joignabilité sont déjà vides."); return; }
    if (confirm("Vider toute la base joignabilité (" + (st2.total || 0) + " ligne(s) conservée(s) + agrégat) ? Cette action est définitive.")) {
      idbClear().then(function () {
        store.data.joign = { agg: {}, imports: [], total: 0 };
        store.save();
        toast("Données de joignabilité supprimées.");
        renderStychAlim(document.querySelector("#main"));

}

"use strict";
/* ============================================================
   Scorecard — affichage des données importées, propre à chaque projet.
   Stych : DMT (appels Ringover, objectif 240 s), SATCLI MTD
   (remplie dans l'Alimentation DATA, objectif 3,8) et Taux de
   joignabilité (fichier « Demande de rappel » .xlsx, objectif 80 %) :
   - filtres communs à sélection multiple (MOIS, JOURS, AGENT) ;
   - graphiques globaux (DMT et SATCLI côte à côte, joignabilité en
     pleine largeur sous les deux), zoomables en plein écran ;
   - tableau combiné par agent (avatar + matricule, DMT, SATCLI,
     Joignabilité), zoomable lui aussi.
   Les autres projets : emplacement réservé tant qu'aucune source
   d'alimentation n'existe pour ce projet.
   Règle des filtres : menus déroulants à SÉLECTION MULTIPLE ;
   aucune sélection = tout voir.
   ============================================================ */

let scState = { mois: [], jour: [], agent: [] };  // filtres communs DMT + SATCLI
let scDocBound = false;

/* Nom d'agent à partir de sa clé (joignabilité = équipe SATCLI + Alain,
   puis équipe DMT) */
function scAgentName(k) {
  const a = JOIGN_AGENTS.find(function (x) { return x.key === k; }) ||
    DMT_AGENTS.find(function (x) { return x.key === k; });
  return a ? a.nom : k;
}

/* ---------- Menu déroulant à sélection multiple (même style que le tableau de bord) ---------- */
function scMselHtml(scObj, key, tag, opts, allLabel) {
  return '<div class="msel" data-key="' + key + '">' +
    '<button type="button" class="msel-btn" aria-expanded="false">' +
    '<span class="msel-tag">' + esc(tag) + '</span><b class="msel-val"></b>' +
    '<span class="chev">' + ic("chevron", 14) + "</span></button>" +
    '<div class="msel-panel">' +
    '<label class="msel-all"><input type="checkbox" class="msel-master"> <span>' + esc(allLabel) + "</span></label>" +
    '<div class="msel-opts">' + opts.map(function (o) {
      return '<label class="msel-opt">' +
        '<input type="checkbox" value="' + esc(o.id) + '"' + (scObj[key].indexOf(o.id) >= 0 ? " checked" : "") + ">" +
        "<span>" + esc(o.label) + "</span></label>";
    }).join("") + "</div></div></div>";
}
function scUpdateLabels(scope, scObj) {
  $all(".msel", scope).forEach(function (box) {
    const key = box.dataset.key;
    const vals = scObj[key] || [];
    const optIds = Array.prototype.slice.call(box.querySelectorAll(".msel-opt input")).map(function (i) { return i.value; });
    const btn = box.querySelector(".msel-val");
    if (!btn) return;
    const allTxt = key === "mois" ? "Tous les mois" : key === "jour" ? "Tous les jours" : key === "statut" ? "Tous les statuts" : "Tous les agents";
    let txt;
    if (!vals.length || vals.length === optIds.length) txt = allTxt;
    else if (vals.length === 1) txt = key === "mois" ? dmtMonthLabel(vals[0])
      : key === "jour" ? dmtDayLabel(vals[0]) : scAgentName(vals[0]);
    else txt = vals.length + (key === "mois" ? " mois" : key === "jour" ? " jours" : " agents");
    btn.textContent = txt;
    const master = box.querySelector(".msel-master");
    if (master) master.checked = !!optIds.length && vals.length === optIds.length;
  });
}
function scBindMsel(root, scObj, rerender) {
  $all(".msel", root).forEach(function (box) {
    const key = box.dataset.key;
    const btn = box.querySelector(".msel-btn");
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      const wasOpen = box.classList.contains("open");
      $all(".msel.open").forEach(function (b) { b.classList.remove("open"); });
      if (!wasOpen) { box.classList.add("open"); btn.setAttribute("aria-expanded", "true"); }
    });
    /* Délégation : les options peuvent être resynchronisées (JOURS suit les mois cochés)
       sans rebrancher d'écouteurs. */
    box.addEventListener("change", function (e) {
      const t = e.target;
      const opts = Array.prototype.slice.call(box.querySelectorAll(".msel-opt input"));
      if (t.classList && t.classList.contains("msel-master")) {
        scObj[key] = t.checked ? opts.map(function (i) { return i.value; }) : [];
        opts.forEach(function (i) { i.checked = t.checked; });
        scUpdateLabels(root, scObj);
        rerender();
      } else if (t.matches && t.matches(".msel-opt input")) {
        scObj[key] = opts.filter(function (c) { return c.checked; }).map(function (c) { return c.value; });
        scUpdateLabels(root, scObj);
        rerender();
      }
    });
  });
  if (!scDocBound) {
    scDocBound = true;
    document.addEventListener("click", function (e) {
      if (!e.target.closest || !e.target.closest(".msel")) {
        $all(".msel.open").forEach(function (b) { b.classList.remove("open"); });
      }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") $all(".msel.open").forEach(function (b) { b.classList.remove("open"); });
    });
  }
}
/* Resynchronise les options JOURS sur les mois cochés (sans fermer le menu ouvert).
   JOURS = union des jours DMT et joignabilité des mois cochés. */
function scSyncJourOptions() {
  const box = document.querySelector('.filters .msel[data-key="jour"]');
  if (!box) return;
  const days = dmtDays(scState.mois);
  const all = days.concat(joignDays(scState.mois).filter(function (d) {
    return days.indexOf(d) < 0;
  })).sort();
  scState.jour = scState.jour.filter(function (d) { return all.indexOf(d) >= 0; });
  const optsEl = box.querySelector(".msel-opts");
  const cur = Array.prototype.slice.call(optsEl.querySelectorAll("input")).map(function (i) { return i.value; });
  if (cur.length === all.length && cur.every(function (v, i) { return v === all[i]; })) return;
  optsEl.innerHTML = all.map(function (d) {
    return '<label class="msel-opt"><input type="checkbox" value="' + d + '"' +
      (scState.jour.indexOf(d) >= 0 ? " checked" : "") + "><span>" + esc(dmtDayLabel(d)) + "</span></label>";
  }).join("");
  scUpdateLabels(box.closest(".card"), scState);
}

/* ---------- Zoom plein écran sur un graphique ou un tableau ---------- */
let scZoomKeyHandler = null;
function scZoomOpen(title, buildBody) {
  scZoomClose();
  const ov = document.createElement("div");
  ov.className = "zoom-overlay";
  ov.innerHTML = '<div class="zoom-box" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +
    '<div class="zoom-head"><h2>' + esc(title) + "</h2>" +
    '<button type="button" class="zoom-close" aria-label="Fermer le zoom">' + ic("x", 16) + "</button></div>" +
    '<div class="zoom-body"></div></div>';
  document.body.appendChild(ov);
  document.body.style.overflow = "hidden";
  buildBody(ov.querySelector(".zoom-body"));
  ov.querySelector(".zoom-close").addEventListener("click", scZoomClose);
  ov.addEventListener("click", function (e) { if (e.target === ov) scZoomClose(); });
  scZoomKeyHandler = function (e) { if (e.key === "Escape") scZoomClose(); };
  document.addEventListener("keydown", scZoomKeyHandler);
}
function scZoomClose() {
  const ov = document.querySelector(".zoom-overlay");
  if (ov) ov.remove();
  document.body.style.overflow = "";
  if (scZoomKeyHandler) { document.removeEventListener("keydown", scZoomKeyHandler); scZoomKeyHandler = null; }
}

/* ---------- Corps de la Scorecard Stych (chips + graphiques + tableau) ---------- */
function scSeries() {
  const effMonths = scState.mois.length ? scState.mois : dmtMonths();
  if (effMonths.length === 1) {
    const mo = effMonths[0];
    const allDays = dmtDays([mo]);
    const days = scState.jour.length ? allDays.filter(function (d) { return scState.jour.indexOf(d) >= 0; }) : allDays;
    return { granularite: "par jour",
      points: days.map(function (d) {
        const p = dmtProjectPeriod([mo], [d], scState.agent);
        return { label: String(parseInt(d.slice(8, 10), 10)), value: p ? p.dmt : null,
          n: p ? p.n : 0, agents: p ? p.agents : 0, full: dmtDayLabel(d) };
      }) };
  }
  return { granularite: "par mois",
    points: effMonths.map(function (mo) {
      const joursDuMois = scState.jour.filter(function (d) { return d.slice(0, 7) === mo; });
      const p = dmtProjectPeriod([mo], joursDuMois, scState.agent);
      const mm = parseInt(mo.slice(5, 7), 10) - 1;
      const full = MONTHS[mm] || mo;
      return { label: DASH_MOIS_SHORT[full] || full.slice(0, 3), value: p ? p.dmt : null,
        n: p ? p.n : 0, agents: p ? p.agents : 0, full: full + " " + mo.slice(0, 4) };
    }) };
}

function renderScBody() {
  const body = $("#scBody");
  if (!body) return;
  scSyncJourOptions();
  const ag = scState.agent;   // agents cochés (liste vide = toute l'équipe)
  const proj = dmtProjectPeriod(scState.mois, scState.jour, ag);

  // Mois SATCLI à afficher : mois filtrés (ou tous), limités aux mois en base SATCLI
  const satBase = satcliMonths();
  const satCols = (scState.mois.length ? scState.mois : satBase).filter(function (m) {
    return satBase.indexOf(m) >= 0;
  });

  // SATCLI d'un agent sur les mois sélectionnés = moyenne de ses valeurs MTD
  const satAgentAvg = function (a) {
    let sum = 0, c = 0;
    satCols.forEach(function (m) {
      const v = satcliValue(a.key, m);
      if (v !== null) { sum += v; c++; }
    });
    return c ? sum / c : null;
  };
  const agentsAff = JOIGN_AGENTS.filter(function (a) { return !ag.length || ag.indexOf(a.key) >= 0; });
  const satAgentVals = agentsAff.map(function (a) { return { a: a, v: satAgentAvg(a) }; })
    .filter(function (x) { return x.v !== null; });
  // SATCLI projet = moyenne des agents (ayant au moins une valeur) sur les mois sélectionnés
  const satProj = satAgentVals.length
    ? { avg: satAgentVals.reduce(function (s, x) { return s + x.v; }, 0) / satAgentVals.length, agents: satAgentVals.length }
    : null;

  // Point SATCLI par mois (moyenne des agents filtrés)
  const satPoints = satCols.map(function (m) {
    const p = satcliMonthAvg(m, ag);
    const mm = parseInt(m.slice(5, 7), 10) - 1;
    const full = MONTHS[mm] || m;
    return { mo: m, label: DASH_MOIS_SHORT[full] || full.slice(0, 3), value: p ? p.avg : null,
      agents: p ? p.agents : 0, full: full + " " + m.slice(0, 4) };
  });
  const satWithVal = satPoints.filter(function (p) { return p.value !== null; });

  // Dénominateur du chip DMT selon le filtre agent
  const dmtDenom = ag.length ? DMT_AGENTS.filter(function (a) { return ag.indexOf(a.key) >= 0; }).length : DMT_AGENTS.length;

  // Légendes (réutilisées dans la vue zoom)
  const dmtLegend = '<div class="dmt-legend">' +
    '<span><i style="background:var(--jade)"></i>Objectif atteint (sous ' + DMT_OBJECTIF + " s)</span>" +
    '<span><i style="background:var(--raspberry)"></i>Au-dessus de l\'objectif</span>' +
    '<span><i style="background:none;border-top:2px dashed var(--raspberry);height:0;width:18px;border-radius:0"></i>Ligne objectif ' + DMT_OBJECTIF + " s</span>" +
    "</div>";
  const satLegend = '<div class="dmt-legend">' +
    '<span><i style="background:var(--jade)"></i>Objectif atteint (' + fmtFr(SATCLI_OBJECTIF, 1) + " ou plus)</span>" +
    '<span><i style="background:var(--raspberry)"></i>Sous l\'objectif</span>' +
    '<span><i style="background:none;border-top:2px dashed var(--raspberry);height:0;width:18px;border-radius:0"></i>Ligne objectif ' + fmtFr(SATCLI_OBJECTIF, 1) + "</span>" +
    "</div>";

  // Chips des trois indicateurs (libellé au-dessus, valeur en dessous)
  const projJ = joignProjectPeriod(scState.mois, scState.jour, ag);
  let html = '<div class="chips">' +
    '<div class="chip">DMT projet<b>' + (proj ? fmtFr(proj.dmt, 1) + " s" : "—") + "</b></div>" +
    '<div class="chip">SATCLI projet<b>' + (satProj ? fmtFr(satProj.avg, 2) : "—") + "</b></div>" +
    '<div class="chip">Joignabilité projet<b>' + (projJ ? fmtFr(projJ.taux * 100, 1) + " %" : "—") + "</b></div>" +
    '<div class="chip">Appels sur la période<b>' + (proj ? proj.n : 0) + "</b></div>" +
    "</div>";

  // Graphiques globaux, côte à côte (DMT en secondes / SATCLI en note sur 5)
  const s = scSeries();
  const duoW = 520;
  const dmtHasVal = s.points.some(function (p) { return p.value !== null; });
  html += '<div class="card"><h2>Graphiques globaux du projet</h2>' +
    '<div class="chart-duo">' +
    '<div><div class="duo-head"><p class="duo-title">DMT projet (secondes)</p>' +
    '<button type="button" class="btn-zoom" id="scZoomDmt" title="Agrandir le graphique DMT">' + ic("search", 14) + "</button></div>";
  if (dmtHasVal) {
    html += '<div class="chart-box' + (s.granularite === "par jour" ? " wide" : "") + '">' +
      dmtChartSvg(s.points, s.granularite, s.granularite === "par jour" ? null : duoW) + "</div>" + dmtLegend;
  } else {
    html += '<div class="empty">Aucune donnée DMT pour cette sélection. Importez le fichier d\'appels dans la page Alimentation DATA.</div>';
  }
  html += "</div><div><div class=\"duo-head\"><p class=\"duo-title\">SATCLI projet (note /5)</p>" +
    '<button type="button" class="btn-zoom" id="scZoomSat" title="Agrandir le graphique SATCLI">' + ic("search", 14) + "</button></div>";
  if (satWithVal.length) {
    html += '<div class="chart-box">' + satcliChartSvg(satPoints, duoW) + "</div>" + satLegend;
  } else {
    html += '<div class="empty">Aucune valeur SATCLI. Remplissez les valeurs MTD dans la page Alimentation DATA.</div>';
  }
  html += "</div></div></div>";

  // Graphique Taux de joignabilité (pleine largeur) + bouton Focus joignabilité
  const js = joignSeries();
  const joignHasVal = js.points.some(function (p) { return p.value !== null; });
  html += '<div class="card"><div class="card-head"><h2>Taux de joignabilité</h2><span class="spacer"></span>' +
    '<button type="button" class="btn btn-ghost btn-sm" id="scAnalyseJoign" title="Ouvrir le Focus joignabilité">' +
    ic("trend", 15) + " Focus joignabilité</button>" +
    '<button type="button" class="btn-zoom" id="scZoomJoign" title="Agrandir le graphique">' + ic("search", 14) + "</button></div>";
  if (joignHasVal) {
    html += '<div class="chart-box wide">' + joignChartSvg(js.points, null) + "</div>" + joignLegendHtml();
  } else {
    html += '<div class="empty">Aucune donnée de joignabilité. Importez le fichier « Demande de rappel » (.xlsx) ' +
      "dans la page Alimentation DATA.</div>";
  }
  html += "</div>";

  // Carte tableau combiné DMT, SATCLI & joignabilité par agent (zoomable)
  html += '<div class="card"><div class="card-head"><h2>DMT, SATCLI &amp; Joignabilité par agent</h2><span class="spacer"></span>' +
    '<button type="button" class="btn-zoom" id="scZoomTable" title="Agrandir le tableau">' + ic("search", 14) + "</button>" +
    '<button type="button" class="btn btn-ghost btn-sm" id="scExport">' + ic("download", 15) + " Exporter CSV</button></div>" +
    '<div id="scTableWrap"></div></div>';

  body.innerHTML = html;

  // Tableau combiné : Agent (matricule Workday), DMT (période filtrée), SATCLI (moyenne des mois filtrés)
  function scIni(nom) {
    const parts = String(nom).split(/[\s\-']+/).filter(Boolean);
    return ((parts[0] ? parts[0][0] : "?") + (parts[1] ? parts[1][0] : (parts[0] && parts[0][1]) || "")).toUpperCase();
  }
  const AGENT_COLORS = ["#007380", "#003D5B", "#CC3262", "#F05E2E", "#002032"];
  let thtml = '<div class="table-wrap"><table class="dmt"><thead><tr>' +
    "<th>Agent</th>" +
    '<th class="num">DMT (s)</th><th class="num">SATCLI (/5)</th><th class="num">Joign. (%)</th></tr></thead><tbody>';
  agentsAff.forEach(function (a, idx) {

/* ---------- Page Scorecard (change de contenu selon le projet) ---------- */
function renderScorecard(root) {
  const act = currentActivity();

  // Projet sans source de données alimentée pour l'instant
  if (act.id !== "stych") {
    root.innerHTML = pageHead("Scorecard — " + act.label,
      "La Scorecard affiche les données importées pour le projet sélectionné.") +
      '<div class="card"><h2>' + ic("grid", 16) + " Scorecard " + esc(act.label) + "</h2>" +
      '<p class="card-sub">Chaque projet a sa propre Scorecard : elle affiche les données importées via les pages ' +
      "« Alimentation » du projet. Pour le moment, aucune alimentation de données n'est encore connectée pour " +
      "<b>" + esc(act.label) + "</b> — la Scorecard se remplira automatiquement dès que la première source " +
      "d'import du projet sera branchée (comme l'Alimentation DMT du projet Stych).</p>" +
      '<div class="empty">Aucune donnée à afficher pour ce projet pour l\'instant.</div></div>';
    return;
  }

  // Nettoyage de la sélection si la base a changé (mois = union DMT + SATCLI + joignabilité)
  const dmtM = dmtMonths(), satM = satcliMonths(), joignM = joignMonths();
  const months = dmtM.concat(satM.filter(function (m) { return dmtM.indexOf(m) < 0; }))
    .concat(joignM.filter(function (m) { return dmtM.indexOf(m) < 0 && satM.indexOf(m) < 0; })).sort();
  scState.mois = scState.mois.filter(function (m) { return months.indexOf(m) >= 0; });
  const dmtD = dmtDays(scState.mois);
  const days = dmtD.concat(joignDays(scState.mois).filter(function (d) {
    return dmtD.indexOf(d) < 0;
  })).sort();
  scState.jour = scState.jour.filter(function (d) { return days.indexOf(d) >= 0; });
  const agentKeys = JOIGN_AGENTS.map(function (a) { return a.key; });
  scState.agent = scState.agent.filter(function (k) { return agentKeys.indexOf(k) >= 0; });

  let html = pageHead("Scorecard — Stych");
  html += '<div class="card sc-filters">' +
    '<div class="filters">' +
    scMselHtml(scState, "mois", "MOIS", months.map(function (m) { return { id: m, label: dmtMonthLabel(m) }; }), "Tous les mois") +
    scMselHtml(scState, "jour", "JOURS", days.map(function (d) { return { id: d, label: dmtDayLabel(d) }; }), "Tous les jours") +
    scMselHtml(scState, "agent", "AGENT", agentKeys.map(function (k) { return { id: k, label: scAgentName(k) }; }), "Tous les agents") +
    "</div>" +
    "</div>";
  html += '<div id="scBody"></div>';
  root.innerHTML = html;

  scBindMsel(root, scState, renderScBody);
  scUpdateLabels(root, scState);
  renderScBody();
}

ROUTES["scorecard"] = renderScorecard;

"use strict";
/* ============================================================
   FOCUS JOIGNABILITÉ — projet Stych uniquement.
   Accessible depuis le bouton « Focus joignabilité » du graphique
   Scorecard et depuis le menu « Performance ». Analyses :
   - contacts traités (barres) + taux de joignabilité (courbe),
     sans ligne d'objectif ;
   - taux par créneau horaire (9h-19h, créneaux arrondis) ;
   - camembert des raisons d'échanges ;
   - secteurs : volume traité et taux de joignabilité.
   Filtres : Mois, Jours, Statut et Agent (sélection multiple).
   Formule de base : clients joints ÷ clients appelés (Décroché
   OUI ÷ (OUI + NON)). La carte Relances (contacts appelés plusieurs
   fois) a été retirée à la demande de l'équipe ; elle pourra être
   réintroduite quand sa formule détaillée sera précisée.
   Données : lignes brutes conservées en IndexedDB (joign.js).
   ============================================================ */

let anaState = { gran: "mois", mois: [], jour: [], statut: [], agent: [] };
const ANA_GRANS = [
  { id: "jour", label: "Jour" },
  { id: "semaine", label: "Semaine" },
  { id: "mois", label: "Mois" },
  { id: "annee", label: "Année" }
];

/* ---------- Découpage par période ---------- */
function anaIsoWeek(day) {
  const date = new Date(day + "T00:00:00Z");
  const dayNum = (date.getUTCDay() + 6) % 7;
  date.setUTCDate(date.getUTCDate() - dayNum + 3);        // jeudi de la semaine ISO
  const isoYear = date.getUTCFullYear();
  const jd4 = new Date(Date.UTC(isoYear, 0, 4));          // 4 janvier
  jd4.setUTCDate(jd4.getUTCDate() - ((jd4.getUTCDay() + 6) % 7) + 3);  // jeudi de la semaine 1
  const week = 1 + Math.round((date.getTime() - jd4.getTime()) / (7 * 86400000));
  return isoYear + "-S" + ("0" + week).slice(-2);
}
function anaGroupKey(day, gran) {
  if (gran === "jour") return day;
  if (gran === "semaine") return anaIsoWeek(day);
  if (gran === "annee") return day.slice(0, 4);
  return day.slice(0, 7);
}
/* Filtre de période : jours cochés d'abord, sinon mois cochés, sinon tout */
function anaDayOk(day, moisList, jourList) {
  if (jourList && jourList.length) return jourList.indexOf(day) >= 0;
  if (moisList && moisList.length) return moisList.indexOf(day.slice(0, 7)) >= 0;
  return true;
}
let anaRowsCache = [];
/* Série du graphique : calculée sur les lignes brutes déjà filtrées
   (agent, statut, période) — l'agrégat jour + agent ne connaît pas le
   statut, il ne peut pas servir quand le filtre de statut est actif. */
function anaSeriesFromRows(rows, gran) {
  const g = {};
  rows.forEach(function (r) {
    const gk = anaGroupKey(r.d, gran);
    if (!g[gk]) g[gk] = { oui: 0, non: 0, ag: {} };
    if (r.dc === "OUI") g[gk].oui++; else g[gk].non++;
    g[gk].ag[r.a] = 1;
  });
  return Object.keys(g).sort().map(function (gk) {
    const o = g[gk].oui, n = o + g[gk].non;
    let label, full;
    if (gran === "jour") {
      label = String(parseInt(gk.slice(8, 10), 10));
      full = dmtDayLabel(gk);
    } else if (gran === "semaine") {
      const wk = parseInt(gk.slice(-2), 10);
      label = "S" + wk;
      full = "Semaine " + wk + " " + gk.slice(0, 4);
    } else if (gran === "annee") {
      label = gk;
      full = "Année " + gk;
    } else {
      const fu = MONTHS[parseInt(gk.slice(5, 7), 10) - 1] || gk;
      label = DASH_MOIS_SHORT[fu] || fu.slice(0, 3);
      full = fu + " " + gk.slice(0, 4);
    }
    return { label: label, value: n ? o / n : null, n: n,
      agents: Object.keys(g[gk].ag).length, full: full };
  });
}

/* ---------- Taux par créneau (données brutes) ----------
   Les créneaux sont ARRONDIS sur les 10 créneaux standard
   (9:00-10:00 … 18:00-19:00) : c'est l'heure de début du créneau
   du fichier qui détermine le créneau horaire (11:00 à 12:01 est
   compté dans 11:00 à 12:00). Les lignes sans créneau lisible
   restent comptées à part, hors créneaux. */
function anaCreneauSlot(c) {
  const m = /^(\d{1,2}):(\d{2})/.exec(String(c || "").trim());
  if (!m) return null;
  let h = parseInt(m[1], 10);
  if (h < 9) h = 9;
  if (h > 18) h = 18;
  return h + ":00 à " + (h + 1) + ":00";
}
function anaCreStart(c) {
  const m = /^(\d{1,2}):(\d{2})/.exec(c);
  return m ? parseInt(m[1], 10) * 60 + parseInt(m[2], 10) : 9999;
}
function anaCreneaux(rows, agentKeys) {
  const g = {}, sans = { oui: 0, non: 0 };
  rows.forEach(function (r) {
    if (agentKeys && agentKeys.length && agentKeys.indexOf(r.a) < 0) return;
    const slot = anaCreneauSlot(r.c);
    if (!slot) {
      if (r.dc === "OUI") sans.oui++; else if (r.dc === "NON") sans.non++;
      return;
    }
    if (!g[slot]) g[slot] = { oui: 0, non: 0 };
    if (r.dc === "OUI") g[slot].oui++; else if (r.dc === "NON") g[slot].non++;
  });
  const slots = [];
  for (let h = 9; h <= 18; h++) {
    const k = h + ":00 à " + (h + 1) + ":00";
    const o = g[k] ? g[k].oui : 0;
    const n = o + (g[k] ? g[k].non : 0);
    slots.push({ c: k, oui: o, total: n, taux: n ? o / n : null, start: h * 60, dim: false });
  }
  const sTotal = sans.oui + sans.non;
  if (sTotal) {
    slots.push({ c: "(sans créneau)", oui: sans.oui, total: sTotal,
      taux: sTotal ? sans.oui / sTotal : null, start: 9999, dim: true });
  }
  return slots;
}


/* ---------- Raisons d'échanges (camembert) ---------- */
const ANA_COLORS = ["var(--jade)", "var(--raspberry)", "var(--tangerine)", "var(--yellow)",
  "var(--blue)", "var(--sea60)", "var(--charcoal)", "var(--sea80)", "#9AA7B0"];
function anaRaisonKey(s) {
  let k = String(s || "").replace(/\s+/g, " ").trim();
  k = k.replace(/dated'examen/gi, "date d'examen");
  if (/^disponibilités? des plannings$/i.test(k)) k = "Disponibilités des plannings";
  return k;
}
function anaRaisons(rows) {
  const g = {};
  rows.forEach(function (r) {
    const k = anaRaisonKey(r.r);
    if (!k) return;
    g[k] = (g[k] || 0) + 1;
  });
  const all = Object.keys(g).map(function (k) { return { k: k, n: g[k] }; })
    .sort(function (a, b) { return b.n - a.n; });
  const items = all.slice(0, 8);
  let autres = 0;
  all.slice(8).forEach(function (x) { autres += x.n; });
  if (autres) items.push({ k: "Autres", n: autres, dim: true });
  const total = all.reduce(function (s, x) { return s + x.n; }, 0);
  return { items: items, total: total, avecRaison: total, rows: rows.length };
}
function anaDonutSvg(items, total) {
  const R = 62, C = 2 * Math.PI * R;
  let cum = 0;
  const parts = items.map(function (x, i) {
    const frac = total ? x.n / total : 0;
    const seg = frac * C;
    const off = -cum;
    cum += seg;
    const col = x.dim ? "#9AA7B0" : (ANA_COLORS[i] || "#9AA7B0");
    return '<circle cx="84" cy="84" r="' + R + '" fill="none" stroke="' + col +
      '" stroke-width="30" stroke-dasharray="' + seg.toFixed(1) + " " + (C - seg).toFixed(1) +
      '" stroke-dashoffset="' + off.toFixed(1) + '"><title>' + esc(x.k + " : " + fmtFr(x.n, 0) +
      " échange(s) — " + (total ? fmtFr(frac * 100, 1) : "0") + " %") + "</title></circle>";
  });
  return '<svg viewBox="0 0 168 168" role="img" aria-label="Répartition des raisons d\'échanges">' +
    '<g transform="rotate(-90 84 84)">' + parts.join("") + "</g>" +
    '<text x="84" y="81" text-anchor="middle" font-size="19" font-weight="800" fill="var(--midnight)">' +
    fmtFr(total, 0) + "</text>" +
    '<text x="84" y="99" text-anchor="middle" font-size="10.5" fill="var(--dim)">échanges</text></svg>';
}
function anaRaisonsCard(rai) {
  let html = '<div class="card"><h2>Raisons d\u2019échanges — répartition (camembert)</h2>';
  if (rai.total) {
    html += '<div class="ana-split">' + anaDonutSvg(rai.items, rai.total) + '<ul class="rai-legend">';
    rai.items.forEach(function (x, i) {
      const col = x.dim ? "#9AA7B0" : (ANA_COLORS[i] || "#9AA7B0");
      html += '<li><i style="background:' + col + '"></i><span>' + esc(x.k) + "</span>" +
        "<b>" + fmtFr(x.n, 0) + "</b><em>" + (rai.total ? fmtFr(x.n / rai.total * 100, 1) : "0") + " %</em></li>";
    });
    html += "</ul></div>" +
      '<p class="card-sub">' + fmtFr(rai.total, 0) + " appel(s) avec une raison d\u2019échange renseignée, sur " +
      fmtFr(rai.rows, 0) + " appel(s) de la sélection — 8 raisons les plus fréquentes + regroupement « Autres ».</p>";
  } else {
    html += '<div class="empty">Aucune raison d\u2019échange renseignée sur la sélection.</div>';
  }
  html += "</div>";
  return html;
}

/* ---------- Secteurs (barres empilées : joints / non joints) ---------- */
function anaSecteurs(rows) {
  const g = {};
  let sans = 0;
  rows.forEach(function (r) {
    const k = String(r.sec || "").replace(/\s+/g, " ").trim();
    if (!k) { sans++; return; }
    if (!g[k]) g[k] = { k: k, n: 0, oui: 0 };
    g[k].n++;
    if (r.dc === "OUI") g[k].oui++;
  });
  const items = Object.keys(g).map(function (k) { return g[k]; });
  items.sort(function (a, b) { return b.n - a.n; });
  const top = items.slice(0, 12);
  top.forEach(function (it) { it.taux = it.n ? it.oui / it.n : null; });
  const total = items.reduce(function (s, x) { return s + x.n; }, 0);
  return { items: top, sans: sans, total: total };
}
function anaSecteursCard(sec) {
  let html = '<div class="card"><h2>Secteurs — volume traité et taux de joignabilité</h2>';
  if (sec.items.length) {
    const maxN = sec.items[0].n;
    html += '<div class="sec-list">';
    sec.items.forEach(function (it) {
      const wN = maxN ? (it.n / maxN) * 100 : 0;
      const wO = it.n ? (it.oui / it.n) * 100 : 0;
      const col = it.taux !== null && it.taux >= JOIGN_OBJECTIF ? "var(--jade)" : "var(--raspberry)";
      html += '<div class="sec-row"><span class="sec-label" title="' + esc(it.k) + '">' + esc(it.k) + "</span>" +
        '<div class="sec-track"><div class="sec-bar" style="width:' + wN.toFixed(1) + '%">' +
        '<div class="sec-oui" style="width:' + wO.toFixed(1) + '%"></div></div></div>' +
        '<span class="sec-n">' + fmtFr(it.n, 0) + "</span>" +
        '<b class="sec-taux" style="color:' + col + '">' +
        (it.taux === null ? "—" : fmtFr(it.taux * 100, 1) + " %") + "</b></div>";
    });
    html += "</div>" +
      '<div class="dmt-legend">' +
      '<span><i style="background:var(--jade)"></i>Appels joints</span>' +
      '<span><i style="background:var(--sea20)"></i>Appels non joints</span>' +
      '<span><i style="background:none;border-top:2px solid var(--raspberry);height:0;width:18px;border-radius:0"></i>Taux sous ' +
      fmtFr(JOIGN_OBJECTIF * 100, 0) + " %</span></div>";
    if (sec.sans) {
      html += '<p class="card-sub">Hors graphique : ' + fmtFr(sec.sans, 0) +
        " appel(s) sans secteur renseigné (colonne « Secteur » vide dans le fichier).</p>";
    }
  } else {
    html += '<div class="empty">Aucun secteur renseigné sur la sélection.</div>';
  }
  html += "</div>";
  return html;
}

/* Options STATUT pour la construction de la page (base d'agrégat).
   La resynchronisation fine se fait sur les lignes (anaSyncStatutOptions). */
function anaStatutItems() {
  const c = joignStore().statuts || {};
  return Object.keys(c).sort(function (a, b) { return c[b] - c[a]; }).map(function (s) {
    return { id: s, label: s ? s : "(sans statut)" };
  });
}

/* ---------- Corps de la page ---------- */
function anaTauxCell(t) {
  if (t === null) return '<td class="num dim">—</td>';
  return '<td class="num"><b class="' + joignAgentClass(t) + '">' + fmtFr(t * 100, 1) + " %</b></td>";
}
function anaHtml(rows) {
  const ag = anaState.agent;
  const granLabel = (ANA_GRANS.find(function (g) { return g.id === anaState.gran; }) || {}).label || "Mois";
  const hasAgg = Object.keys(joignStore().agg).length > 0;

  let html = "";
  // Les 4 graphiques (contacts/taux, créneaux, raisons, secteurs) sont
  // regroupés dans une grille « deux par deux » occupant toute la largeur.
  html += '<div class="ana-grid">';
  // 1. Contacts traités (barres) + taux de joignabilité (courbe), sans objectif
  html += '<div class="card"><div class="card-head"><h2>Contacts traités et taux de joignabilité par ' +
    esc(granLabel.toLowerCase()) + "</h2>" +
    '<span class="spacer"></span>' +
    '<button type="button" class="btn-zoom" id="anZoom" title="Agrandir le graphique">' + ic("search", 14) + "</button></div>";
  if (hasAgg) {
    const series = anaSeriesFromRows(rows, anaState.gran);
    html += '<div class="chart-box wide">' + joignComboSvg(series, null) + "</div>" + joignLegendComboHtml();
  } else {
    html += '<div class="empty">Aucune donnée : importez le fichier « Demande de rappel » dans la page Alimentation DATA.</div>';
  }
  html += "</div>";

  // 2. Par créneau
  const cre = anaCreneaux(rows, ag);
  html += '<div class="card"><h2>Taux de joignabilité par créneau horaire</h2>';
  if (cre.length) {
    html += '<div class="table-wrap"><table class="dmt"><thead><tr>' +
      '<th>Créneau</th><th class="num">Appelés</th><th class="num">Joints</th><th class="num">Taux</th>' +
      "</tr></thead><tbody>";
    cre.forEach(function (x) {
      html += "<tr><td" + (x.dim ? ' class="dim"' : "") + ">" + esc(x.c) +
        '</td><td class="num' + (x.dim ? " dim" : "") + '">' + x.total +
        '</td><td class="num' + (x.dim ? " dim" : "") + '">' + x.oui + "</td>" +
        anaTauxCell(x.dim ? null : x.taux) + "</tr>";
    });
    html += "</tbody></table></div>";
  } else {
    html += '<div class="empty">Aucune donnée sur la sélection.</div>';
  }
  html += "</div>";

  // 3. Raisons d'échanges (camembert)
  html += anaRaisonsCard(anaRaisons(rows));

  // 4. Secteurs
  html += anaSecteursCard(anaSecteurs(rows));

  html += "</div>"; // fin de la grille 2×2 des graphiques

  // La carte Relances (contacts appelés plusieurs fois) a été retirée à la
  // demande de l'équipe ; réintroduction possible quand sa formule détaillée
  // sera précisée.
  return html;
}

"use strict";
/* ============================================================
   PLANNING — planning des équipes par projet, à partir du
   fichier « Validation Planning Sxx_2026 » (.xlsb / .xlsx).
   Feuille « Modification PROD » : un agent par ligne, 7 jours
   avec Début / Fin / Pause / Heures planifiées.
   Lecture .xlsb : classeur binaire BIFF12 dans une archive ZIP —
   enregistrements à en-tête variable (type 7 bits ×1-2, taille
   7 bits ×1-4), chaînes cch u32 + UTF-16LE, cellules col u32 +
   style 3 octets + fPhShow 1 octet, RK compressé.
   Conservation : une fiche par semaine en IndexedDB (base
   « bo-sup », magasin « planning », clé = semaine).
   Périmètre : seuls les agents de NOS projets (Bytel, Driiveme,
   Legalplace, Stych) sont conservés — le fichier en contient une
   vingtaine d'autres, ignorés.
   Vue : la rubrique Planning (menu « Mes heures ») est scopée sur le
   projet sélectionné (ex : Stych -> planning des agents Stych
   uniquement) ; l'import du fichier se fait depuis CONFIG ->
   Alimentation DATA ; filtres Semaine / Début de shift / Agent / Jour,
   synthèse des agents en prod / congé / repos par jour, tableau du
   projet (shift début-fin + temps de travail).
   ============================================================ */

/* ---------- Lecture d'une feuille « Modification PROD » ---------- */
const PL_DAYS = ["LUN", "MAR", "MER", "JEU", "VEN", "SAM", "DIM"];
const PL_DAY_LABELS = { LUN: "Lundi", MAR: "Mardi", MER: "Mercredi", JEU: "Jeudi", VEN: "Vendredi", SAM: "Samedi", DIM: "Dimanche" };
const PL_SHEET = "modification prod";

/* ---------- Périmètre : nos 4 projets ----------
   Le fichier « Validation Planning » couvre tous les projets du site
   (projets « … - TAMATAVE »). On ne garde que ceux correspondant aux
   activités de l'application ; la rubrique Planning affiche ensuite
   uniquement le projet sélectionné (activité en cours). */
const PL_PROJECTS = {
  bouygues:   { label: "Bytel (Bouygues Telecom)", match: ["bytel digital", "bytel"] },
  driiveme:   { label: "Driiveme", match: ["driiveme"] },
  legalplace: { label: "Legalplace", match: ["legalplace"] },
  stych:      { label: "Stych", match: ["stych"] }
};
/* Nom de projet du fichier -> activité de l'app (null si hors périmètre) */
function plProjOfName(proj) {
  const t = plNorm(proj);
  const ids = Object.keys(PL_PROJECTS);
  for (let i = 0; i < ids.length; i++) {
    const ms = PL_PROJECTS[ids[i]].match;
    for (let j = 0; j < ms.length; j++) {
      if (t.indexOf(ms[j]) >= 0) return ids[i];
    }
  }
  return null;
}

function plNorm(s) {
  return String(s === null || s === undefined ? "" : s)
    .replace(/\s+/g, " ").trim().toLowerCase()
    .replace(/é|è|ê|ë/g, "e").replace(/à|â/g, "a").replace(/ô/g, "o").replace(/ç/g, "c");
}
/* Valeur numérique Excel (fraction de jour) -> "HH:MM" */
function plFracToHM(v) {
  if (typeof v !== "number" || !isFinite(v) || v < 0) return null;
  let m = Math.round(v * 24 * 60);
  m = m % (24 * 60);
  const hh = Math.floor(m / 60), mm = m % 60;
  return (hh < 10 ? "0" : "") + hh + ":" + (mm < 10 ? "0" : "") + mm;
}
function plHmToMin(s) {
  const m = /^(\d{1,2}):(\d{2})/.exec(String(s || "").trim());
  if (!m) return null;
  return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
}
function plIsHm(v) {
  if (typeof v === "number") return v >= 0 && v < 1.2;
  return /^\d{1,2}:\d{2}(:\d{2})?$/.test(String(v || "").trim());
}

/* ---------- Records BIFF12 (.xlsb) ---------- */
function plRecHdr(b, o) {
  let t = b[o]; o++;
  if (t & 0x80) { t = (t & 0x7F) + ((b[o] & 0x7F) << 7); o++; }
  let L = 0, sh = 0, c;
  do { c = b[o++]; L += (c & 0x7F) << sh; sh += 7; } while ((c & 0x80) && sh < 28);
  return { t: t, p: o, end: o + L };
}
function plU32(b, o) { return (b[o] | (b[o + 1] << 8) | (b[o + 2] << 16) | (b[o + 3] << 24)) >>> 0; }
function plI32(b, o) { return b[o] | (b[o + 1] << 8) | (b[o + 2] << 16) | (b[o + 3] << 24); }
function plF64(b, o) { const dv = new DataView(b.buffer, b.byteOffset, b.byteLength); return dv.getFloat64(o, true); }
/* XLWideString : cch u32 + UTF-16LE (cch = 0xFFFFFFFF -> chaîne nulle) */
function plWideStr(b, o) {
  const cch = plU32(b, o); o += 4;
  if (cch === 0 || cch === 0xFFFFFFFF) return ["", o];
  if (cch > 100000 || o + 2 * cch > b.length) return ["", o];
  let s = "";
  for (let i = 0; i < cch; i++) s += String.fromCharCode(b[o + 2 * i] | (b[o + 2 * i + 1] << 8));
  return [s, o + 2 * cch];
}
/* RichStr (BrtCellSt…) : flags u8 + XLWideString ; les runs enrichis sont
   bornés par la taille du record et ignorés. */
function plRichStr(b, o) {
  return plWideStr(b, o + 1)[0];
}
/* RK compressé -> nombre (double reconstruit en little-endian) */
function plRk(b, o) {
  const b0 = b[o], b1 = b[o + 1], b2 = b[o + 2], b3 = b[o + 3];
  const fX100 = b0 & 1, fInt = b0 & 2;
  let v;
  if (fInt) { v = plI32(b, o) >> 2; }
  else {
    const arr = [0, 0, 0, 0, b0 & 0xFC, b1, b2, b3];
    const dv = new DataView(new ArrayBuffer(8));
    for (let i = 0; i < 8; i++) dv.setUint8(i, arr[i]);
    v = dv.getFloat64(0, true);
  }
  return fX100 ? v / 100 : v;
}
/* Feuille .bin -> lignes [{r, cells:{col:val}}] (0-based) */
async function plParseSheetBin(b, sst, maxCols) {
  const out = [];
  let cur = null, lastCol = -1, o = 0, n = 0;
  while (o < b.length) {
    const h = plRecHdr(b, o);
    if (h.end > b.length) break;
    if (h.t === 0x0000) {                       // BrtRowHdr
      cur = { r: plI32(b, h.p), cells: {} };
      out.push(cur);
      lastCol = -1;
    } else {
      let col = -1, vp = h.p;
      if (h.t >= 0x000C && h.t <= 0x0012) { vp = h.p + 4; col = lastCol + 1; }   // short cell
      else { col = plU32(b, h.p); vp = h.p + 8; }
      let val = null;
      switch (h.t) {
        case 0x0002: case 0x000D: val = plRk(b, vp); break;                     // rk
        case 0x0003: case 0x000E: case 0x000B: case 0x000A: val = b[vp]; break; // erreur
        case 0x0004: case 0x000F: val = b[vp] ? 1 : 0; break;                   // booléen
        case 0x0005: case 0x0009: case 0x0010: val = plF64(b, vp); break;       // réel / fmla num
        case 0x0006: case 0x0011: case 0x003E: val = plRichStr(b, vp); break;   // texte inline
        case 0x0008: val = plWideStr(b, vp)[0]; break;                          // fmla texte
        case 0x0007: case 0x0012: {                                             // index SST
          const ix = plU32(b, vp);
          val = sst[ix] !== undefined ? sst[ix] : "";
          break;
        }
        default: break;
      }
      if (cur && col >= 0 && col < maxCols) { cur.cells[col] = val; lastCol = col; }
    }
    o = h.end;
    if (++n % 200000 === 0) await xlsxYield();
  }
  return out;
}
/* sharedStrings.bin -> tableau de chaînes */
function plParseSstBin(b) {
  const sst = [];
  let o = 0;
  while (o < b.length) {
    const h = plRecHdr(b, o);
    if (h.t === 0x0013) sst.push(plWideStr(b, h.p + 1)[0]);   // flags u8 puis XLWideString
    if (h.t === 0x00A0) break;
    o = h.end;
  }
  return sst;
}
/* workbook.bin -> [{name, relid, hidden}] */
function plParseWorkbookBin(b) {
  const sheets = [];
  let o = 0;
  while (o < b.length) {
    const h = plRecHdr(b, o);
    if (h.t === 0x009C) {                     // BrtBundleSh
      let p = h.p;
      p += 4;                                 // hsState
      p += 4;                                 // iTabID
      let relid = "";
      const cch = plU32(b, p);
      if (cch !== 0 && cch !== 0xFFFFFFFF) {
        for (let i = 0; i < cch; i++) relid += String.fromCharCode(b[p + 4 + 2 * i] | (b[p + 4 + 2 * i + 1] << 8));
      }
      p += 4 + 2 * cch;
      const nm = plWideStr(b, p)[0];
      sheets.push({ name: nm, relid: relid, hidden: false });
    }
    o = h.end;
  }
  return sheets;
}
function plRelsMap(xml) {
  const out = {};
  const re = /Id="(rId\d+)"[^>]*?Target="([^"]+)"/g;
  let m;
  while ((m = re.exec(xml)) !== null) out[m[1]] = m[2];
  return out;
}
function plFindSheet(sheets) {
  let found = null;
  for (const s of sheets) {
    if (plNorm(s.name) === PL_SHEET) return s.name;
    if (!found && plNorm(s.name).indexOf(PL_SHEET) >= 0) found = s.name;
  }
  return found;
}

/* ---------- Feuille .xlsx par nom de feuille (XML) ---------- */
async function plParseSheetXml(xml, shared, maxCols) {
  const rows = [];
  const RE_ROW = /<row[^>]*\br="(\d+)"[^>]*\/?>([\s\S]*?)<\/row>/g;
  const RE_CELL = /<c\s+([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g;
  let m, n = 0;
  while ((m = RE_ROW.exec(xml)) !== null) {
    const r = parseInt(m[1], 10);
    const cells = {};
    let cm, hasVal = false;
    RE_CELL.lastIndex = 0;
    while ((cm = RE_CELL.exec(m[2])) !== null) {
      const attrs = cm[1], body = cm[2];
      if (body === undefined) continue;
      const rm = /r="([A-Z]+)\d+"/.exec(attrs);
      if (!rm) continue;
      const ci = xlsxColIdx(rm[1]);
      if (ci >= maxCols) continue;
      let v = "";
      if ((/\st="s"/).test(attrs)) {
        const vm = /<v(?:\s[^>]*)?>([\s\S]*?)<\/v>/.exec(body);
        v = vm ? (shared[parseInt(vm[1], 10)] || "") : "";
      } else if ((/\st="inlineStr"/).test(attrs)) {
        let txt = "";
        const tre = /<t[^>]*>([\s\S]*?)<\/t>/g;
        let tm;
        while ((tm = tre.exec(body)) !== null) txt += tm[1];
        v = xmlUnesc(txt);
      } else {
        const vm = /<v(?:\s[^>]*)?>([\s\S]*?)<\/v>/.exec(body);
        v = vm ? xmlUnesc(vm[1]) : "";
      }
      if (v !== "") { cells[ci] = v; hasVal = true; }
    }
    if (hasVal) rows.push({ r: r - 1, cells: cells });    // lignes XML 1-based -> 0-based
    if (++n % 20000 === 0) await xlsxYield();
  }
  return rows;
}

/* ---------- Import complet -> fiche semaine ---------- */
/* jours : de/a numériques ou "HH:MM(:SS)" -> travail ; jetons sinon */
function plCellTxt(v) {
  if (v === null || v === undefined) return "";
  return String(v).trim();
}
function plDayCell(de, a, pa, h) {
  const d = { k: "", s: "", e: "", pa: "", net: 0 };
  const deTxt = plCellTxt(de), aTxt = plCellTxt(a), paTxt = plCellTxt(pa);
  const deHm = plIsHm(de) ? (typeof de === "number" ? plFracToHM(de) : plFracToHM(plHmToMin(deTxt) / 1440)) : null;
  const aHm = plIsHm(a) ? (typeof a === "number" ? plFracToHM(a) : plFracToHM(plHmToMin(aTxt) / 1440)) : null;
  const tok = plNorm(deTxt);
  if (deHm && aHm) {
    d.k = "work"; d.s = deHm; d.e = aHm;
    const sm = plHmToMin(deHm), em = plHmToMin(aHm);
    let diff = em - sm;
    if (diff < 0) diff += 24 * 60;
    let pd = 0;
    const parts = paTxt.split("-");
    if (parts.length === 2) {
      const p1 = plHmToMin(parts[0]), p2 = plHmToMin(parts[1]);
      if (p1 !== null && p2 !== null) pd = p2 - p1;
    }
    d.net = Math.max(0, Math.round(((diff - pd) / 60) * 100) / 100);
    d.pa = paTxt;
    return d;
  }
  if (tok.indexOf("conge") >= 0 || tok === "cp") { d.k = "conge"; d.s = deTxt; return d; }
  if (tok === "libre" || tok.indexOf("off") === 0 || tok === "repos") { d.k = "repos"; d.s = deTxt; return d; }
  if (tok) { d.k = "autre"; d.s = deTxt; return d; }
  if (aHm) { d.k = "autre"; d.s = aHm; return d; }
  return d;
}
function plWeekFromName(fileName) {
  const m = /S\s*(\d{1,2})\D{0,3}(\d{4})/i.exec(String(fileName || ""));
  if (m) return "S" + parseInt(m[1], 10) + "-" + m[2];
  const d = new Date();
  const jj = (d.getDate() < 10 ? "0" : "") + d.getDate();
  const mo = (d.getMonth() + 1 < 10 ? "0" : "") + (d.getMonth() + 1);
  return "Import du " + jj + "/" + mo + "/" + d.getFullYear();
}
/* rows [{r, cells}] -> { week, file, imported, agents:[…] } ; throw si vide */
function plBuildWeek(rows, week, fileName) {
  let hdrRow = -1;
  for (const row of rows) {
    const f = plCellTxt(row.cells[5]).toLowerCase();
    const g = plCellTxt(row.cells[6]).toLowerCase();
    if (f === "name" && g.indexOf("actual") >= 0) { hdrRow = row.r; break; }
  }
  if (hdrRow < 0) {
    for (const row of rows) {
      if (plCellTxt(row.cells[5]).toLowerCase() === "name") { hdrRow = row.r; break; }
    }
  }
  if (hdrRow < 0) throw new Error("Ligne d'en-tête « Name / Actual Project » introuvable dans la feuille.");
  const agents = [];
  let nTotal = 0, nDropped = 0;
  for (const row of rows) {
    if (row.r <= hdrRow) continue;
    const name = plCellTxt(row.cells[5]);
    const proj = plCellTxt(row.cells[6]).replace(/\s+/g, " ").trim();
    if (!name && !proj) continue;
    if (!name || !proj) continue;                       // lignes incomplètes ignorées
    nTotal++;
    if (!plProjOfName(proj)) { nDropped++; continue; }  // hors de nos 4 projets : ignoré
    const d = [];
    for (let i = 0; i < 7; i++) {
      d.push(plDayCell(row.cells[10 + i * 4], row.cells[11 + i * 4], row.cells[12 + i * 4], row.cells[13 + i * 4]));
    }
    agents.push({
      p: proj,
      n: name.replace(/\s+/g, " ").trim(),
      w: plCellTxt(row.cells[3]),
      pay: plCellTxt(row.cells[4]),
      st: plCellTxt(row.cells[8]),
      bt: plCellTxt(row.cells[9]),
      d: d
    });
  }
  if (!agents.length) throw new Error("Aucun agent des projets Bytel, Driiveme, Legalplace ou Stych trouvé dans la feuille « Modification PROD ».");
  const projects = {};
  agents.forEach(function (a) { projects[a.p] = (projects[a.p] || 0) + 1; });
  return { week: week, file: String(fileName || ""), imported: new Date().toISOString(), agents: agents, nProj: Object.keys(projects).length, nTotal: nTotal, nDropped: nDropped };
}
/* Ouvre le classeur (.xlsb binaire ou .xlsx XML) et renvoie les lignes
   de la feuille « Modification PROD ». */
async function plReadPlanning(arrayBuffer) {
  const b = new Uint8Array(arrayBuffer);
  const entries = xlsxEntries(b);
  const isXlsb = entries.some(function (x) { return x.name === "xl/workbook.bin"; });
  if (isXlsb) {
    const sheets = plParseWorkbookBin(await xlsxEntry(b, entries, "xl/workbook.bin"));
    const sheetName = plFindSheet(sheets);
    if (!sheetName) throw new Error("Feuille « Modification PROD » introuvable. Feuilles : " +
      sheets.map(function (s) { return s.name; }).join(", "));
    const rels = plRelsMap(xlsxDecode(await xlsxEntry(b, entries, "xl/_rels/workbook.bin.rels")));
    const target = rels[sheets.find(function (s) { return s.name === sheetName; }).relid];
    if (!target) throw new Error("Relation de la feuille « " + sheetName + " » introuvable.");
    const sst = plParseSstBin(await xlsxEntry(b, entries, "xl/sharedStrings.bin"));
    return plParseSheetBin(await xlsxEntry(b, entries, "xl/" + target.replace(/^\//, "")), sst, 39);
  }
  /* .xlsx : workbook.xml + relations + feuille XML */
  const wbXml = xlsxDecode(await xlsxEntry(b, entries, "xl/workbook.xml"));
  const relsXml = xlsxDecode(await xlsxEntry(b, entries, "xl/_rels/workbook.xml.rels"));
  const rels = plRelsMap(relsXml);
  let target = null;
  const reSheet = /<sheet[^>]*name="([^"]+)"[^>]*?r:id="(rId\d+)"[^>]*\/?>/g;
  let m, found = null;
  while ((m = reSheet.exec(wbXml)) !== null) {
    const nm = xmlUnesc(m[1]);
    if (plNorm(nm) === PL_SHEET) { target = rels[m[2]]; found = nm; break; }
    if (!found && plNorm(nm).indexOf(PL_SHEET) >= 0) { target = rels[m[2]]; found = nm; }
  }
  if (!target) throw new Error("Feuille « Modification PROD » introuvable dans le fichier .xlsx.");
  const sharedXml = xlsxDecode(await xlsxEntry(b, entries, "xl/sharedStrings.xml"));
  const shared = xlsxSharedStrings(sharedXml);
  const sheetXml = xlsxDecode(await xlsxEntry(b, entries, "xl/" + target.replace(/^\//, "")));
  return plParseSheetXml(sheetXml, shared, 39);
}
async function plImportFile(arrayBuffer, fileName) {
  const rows = await plReadPlanning(arrayBuffer);
  const week = plWeekFromName(fileName);
  const rec = plBuildWeek(rows, week, fileName);
  await plPutWeek(rec);
  return rec;
}

/* ---------- IndexedDB : magasin « planning » (clé = semaine) ---------- */
function plPutWeek(rec) {
  return idbTx("readwrite", "planning").then(function (st) {
    return new Promise(function (resolve, reject) {
      st.put(rec);
      st.transaction.oncomplete = function () { resolve(); };
      st.transaction.onerror = function () { reject(st.transaction.error); };
    });
  });
}
function plAllWeeks() {
  return idbTx("readonly", "planning").then(function (st) {
    return new Promise(function (resolve, reject) {
      const rq = st.getAll();
      rq.onsuccess = function () { resolve(rq.result || []); };
      rq.onerror = function () { reject(rq.error); };
    });
  });
}
function plDelWeek(week) {
  return idbTx("readwrite", "planning").then(function (st) {
    return new Promise(function (resolve, reject) {
      st.delete(week);
      st.transaction.oncomplete = function () { resolve(); };
      st.transaction.onerror = function () { reject(st.transaction.error); };
    });
  });
}

let plDocBound = false;

/* ---------- Aides d'affichage ---------- */
function plFmtDur(net) {
  if (!net || net <= 0) return "—";
  const h = Math.floor(net + 1e-9), m = Math.round((net - h) * 60);
  if (m >= 60) { return (h + 1) + "h"; }
  return h + "h" + (m ? (m < 10 ? "0" : "") + m : "");
}
function plDayHtml(d) {
  if (d.k === "work") return '<div class="pl-t">' + esc(d.s) + "–" + esc(d.e) + "</div>";
  if (d.k === "conge") return '<span class="pl-cg">' + esc(d.s || "Congé") + "</span>";
  if (d.k === "repos") return '<span class="pl-rs">' + esc(d.s || "Repos") + "</span>";
  if (d.k === "autre") return '<span class="pl-t">' + esc(d.s) + "</span>";
  return "—";
}
function plDayKey(d) {
  if (!d) return "";
  return d.k;
}

/* Comptes par semaine, limités à nos projets (les anciens imports
   pouvaient contenir les autres projets du fichier). */
function plWkCount(w) {
  let n = 0; const ps = {};
  w.agents.forEach(function (a) { if (plProjOfName(a.p)) { n++; ps[a.p] = 1; } });
  return { n: n, np: Object.keys(ps).length };
}
function plImportBoxHtml(weeks) {

  let html = '<details class="card pl-import"' + (weeks.length ? "" : " open") + "><summary>" +

    (weeks.length ? '<span class="pl-count">' + weeks.length + " semaine(s) chargée(s)</span>" : "") +
    "</summary>" +
    '<p class="card-sub">Fichier « Validation Planning Sxx_aaaa » (.xlsb, .xlsx ou .xlsm). ' +
    "Seuls les agents des projets Bytel, Driiveme, Legalplace et Stych sont conservés ; " +
    "un ré-import remplace la même semaine sans effacer les autres.</p>" +
    '<input type="file" id="plFile" accept=".xlsb,.xlsx,.xlsm"></details>';
