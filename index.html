  --jade: #007380;
  --seafoam: #25E2CC;
  --blue: #003D5B;
  --yellow: #FBCA18;
  --raspberry: #CC3262;
  --tangerine: #F05E2E;
  --gray: #F2F2F2;
  --charcoal: #2A2B2C;
  --sea80: #51E8D6;
  --sea60: #7CEEE0;
  --sea40: #A8F3EB;
  --sea20: #D3F8F5;
  --sea10: #E9FCFA;
  --border: #E3E9EE;
  --dim: #5E707C;
  --shadow: 0 1px 3px rgba(0, 32, 50, 0.08);
  --topbar-h: 58px;
  --sidebar-w: 272px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--white);
  color: var(--charcoal);
  font-size: 15px;
  line-height: 1.5;
}
button { font-family: inherit; }
a { color: var(--jade); }

/* ---------------- En-tête fixe ---------------- */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; height: var(--topbar-h);
  background: var(--midnight); color: #fff;
  display: flex; align-items: center; gap: 12px;
  padding: 0 16px; z-index: 50;
}
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 40px; height: 40px; border-radius: 8px; border: none;
  background: transparent; color: #fff; cursor: pointer; flex: 0 0 auto;
}
.icon-btn:hover { background: rgba(255, 255, 255, 0.08); color: var(--seafoam); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; color: #fff; text-decoration: none; cursor: pointer; }
.brand:hover .brand-name { color: var(--seafoam); }
.brand > div { min-width: 0; }
.brand-logo { width: 30px; height: 30px; flex: 0 0 auto; }
.brand-logo svg { width: 100%; height: 100%; display: block; border-radius: 7px; }
.brand-name { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-sub { font-size: 11px; color: var(--seafoam); opacity: .85; white-space: nowrap; }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
.act-label { font-size: 12px; color: var(--seafoam); text-transform: uppercase; letter-spacing: .5px; }
.act-wrap { position: relative; }
.act-wrap select {
  appearance: none; -webkit-appearance: none;
  background: var(--blue); color: #fff; border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 8px; padding: 9px 34px 9px 12px; font-size: 14px; font-weight: 600;
  cursor: pointer; max-width: 220px;
}
.act-wrap select:focus { outline: 2px solid var(--seafoam); outline-offset: 1px; }
.act-chevron { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--seafoam); display: inline-flex; }

/* ---------------- Menu latéral ---------------- */
.backdrop { display: none; position: fixed; inset: 0; background: rgba(0, 32, 50, 0.45); z-index: 40; }
body.sidebar-open .backdrop { display: block; }
@media (min-width: 1024px) { body.sidebar-open .backdrop { display: none; } }
.sidebar {
  position: fixed; top: var(--topbar-h); bottom: 0; left: 0; width: var(--sidebar-w);
  background: var(--midnight); color: #fff; z-index: 45;
  transform: translateX(-100%); transition: transform .22s ease;
  display: flex; flex-direction: column; overflow-y: auto;
}
body.sidebar-open .sidebar { transform: none; }
.side-head { padding: 14px 18px 6px; }
.side-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--seafoam); opacity: .8; }
.nav { list-style: none; margin: 0; padding: 6px 10px 10px; flex: 1; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  border-radius: 8px; color: rgba(255, 255, 255, .85); text-decoration: none;
  font-size: 14px; cursor: pointer; border-left: 3px solid transparent;
}
.nav-item:hover { background: rgba(255, 255, 255, .07); color: #fff; }
.nav-item.active {
  background: rgba(37, 226, 204, .13); color: var(--seafoam);
  border-left-color: var(--seafoam); font-weight: 600;
}
.nav-group-head {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 10px 12px; background: none; border: none; cursor: pointer;
  color: rgba(255, 255, 255, .92); font-size: 13px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .6px; text-align: left; border-radius: 8px;
}
.nav-group-head:hover { background: rgba(255, 255, 255, .07); }
.nav-group-head .chev { margin-left: auto; transition: transform .2s; display: inline-flex; color: var(--seafoam); }
.nav-group.open .nav-group-head .chev { transform: rotate(180deg); }
.nav-sub { list-style: none; margin: 2px 0 4px; padding: 0 0 0 14px; display: none; }
.nav-group.open .nav-sub { display: block; }
.nav-sub .nav-item { font-size: 13.5px; padding: 8px 12px; }
.side-foot {
  padding: 12px 18px 16px; font-size: 12px; color: rgba(255, 255, 255, .6);
  border-top: 1px solid rgba(255, 255, 255, .1);
}
.side-foot b { color: var(--seafoam); font-size: 13px; }

/* ---------------- Contenu principal ---------------- */
.main {
  padding: calc(var(--topbar-h) + 20px) 22px 40px;
  max-width: 1280px; margin: 0 auto;
  transition: margin-left .22s ease;
}
@media (min-width: 1024px) { body.sidebar-open .main { margin-left: calc(var(--sidebar-w) + 8px); } }
.page-head { margin: 0 0 18px; }
.page-head h1 { margin: 0; font-size: clamp(1.3rem, 3vw, 1.55rem); color: var(--midnight); }
.page-sub { margin: 4px 0 0; color: var(--dim); font-size: 14px; }
.card {
  background: var(--white); border: 1px solid var(--border);
  border-radius: 12px; padding: 18px 20px; box-shadow: var(--shadow); margin-bottom: 18px;
}
.card > h2 { margin: 0 0 4px; font-size: 16px; color: var(--midnight); }
.card .card-sub { margin: 0 0 14px; color: var(--dim); font-size: 13px; }
.card-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.card-head h2 { margin: 0; }
.card-head .spacer { flex: 1; }

/* ---------------- Formulaires ---------------- */
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
.field label { display: block; font-size: 12px; font-weight: 700; color: var(--blue); margin-bottom: 5px; }
.field input, .field select {
  width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px;
  font-size: 14px; color: var(--charcoal); background: #fff; font-family: inherit;
}
.field input:focus, .field select:focus { outline: 2px solid var(--seafoam); border-color: var(--seafoam); }
.field .hint { font-size: 11px; color: var(--dim); margin-top: 3px; }
.form-actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px;
  border-radius: 8px; border: 1px solid transparent; font-weight: 600; font-size: 14px;
  cursor: pointer; text-decoration: none;
}
.btn-primary { background: var(--jade); color: #fff; }
.btn-primary:hover { background: #005c66; }
.btn-ghost { background: #fff; border-color: var(--border); color: var(--charcoal); }
.btn-ghost:hover { border-color: var(--seafoam); color: var(--jade); }
.btn-danger { background: var(--raspberry); color: #fff; }
.btn-sm { padding: 6px 10px; font-size: 13px; border-radius: 7px; }
.identity-box {
  background: var(--sea10); border: 1px solid var(--sea20); border-radius: 10px;
  padding: 10px 14px; margin-bottom: 14px; font-size: 13px; color: var(--charcoal);
  display: flex; flex-wrap: wrap; gap: 6px 22px;
}
.identity-box b { color: var(--jade); }
.identity-box span em { font-style: normal; color: var(--dim); }
fieldset.fieldset {
  border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px 16px; margin: 0 0 14px;
}
fieldset.fieldset legend { font-size: 13px; font-weight: 700; color: var(--midnight); padding: 0 6px; }
.adv-details { margin-top: 4px; }
.adv-details summary {
  cursor: pointer; font-size: 13px; font-weight: 700; color: var(--blue);
  background: var(--gray); border-radius: 8px; padding: 10px 14px; list-style-position: inside;
}
.adv-blocks { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin-top: 12px; }
.adv-block { border: 1px dashed var(--border); border-radius: 10px; padding: 10px 12px 12px; }
.adv-block h4 { margin: 0 0 8px; font-size: 12px; color: var(--jade); text-transform: uppercase; letter-spacing: .4px; }
.adv-block .form-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
.adv-block label { font-size: 10.5px; }

/* ---------------- Tableaux ---------------- */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--border); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; background: #fff; }
table.perf { min-width: 1150px; }
table.team { min-width: 1000px; }
table.fdr { min-width: 980px; }
.cell-input {
  width: 60px; padding: 5px 6px; border: 1px solid var(--border); border-radius: 6px;
  font-size: 13px; text-align: right; color: var(--charcoal); background: #fff; font-family: inherit;
}
.cell-input:focus { outline: 2px solid var(--seafoam); border-color: var(--seafoam); }
.fdr-month { white-space: nowrap; font-weight: 600; }
thead th {
  background: var(--sea10); color: var(--blue); text-align: left;
  font-size: 11px; text-transform: uppercase; letter-spacing: .4px;
  padding: 9px 10px; border-bottom: 2px solid var(--sea20); white-space: nowrap;
}
tbody td { padding: 8px 10px; border-bottom: 1px solid var(--gray); vertical-align: top; }
tbody tr:hover { background: var(--sea10); }
tbody tr:last-child td { border-bottom: none; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.dim { color: var(--dim); font-size: 12px; }
/* Tableau Scorecard « DMT & SATCLI par agent » : habillage aux couleurs du thème */
table.dmt thead th {
  background: var(--midnight); color: #fff; border-bottom: 2px solid var(--jade);
  padding: 10px 12px; letter-spacing: .6px;
}
table.dmt tbody td { padding: 9px 12px; border-bottom: 1px solid var(--sea20); }
table.dmt tbody tr:hover { background: var(--sea10); }
.ag { display: flex; align-items: center; gap: 10px; min-width: 170px; }
.ag-av {
  width: 30px; height: 30px; border-radius: 50%; flex: 0 0 auto;
  display: inline-flex; align-items: center; justify-content: center;
  color: #fff; font-size: 11px; font-weight: 700; letter-spacing: .5px;
}
.ag-mat { display: block; color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; margin-top: 1px; }
table.dmt td.num b { font-size: 14px; }
.flux-cell b { display: block; }
.flux-cell span {
  display: inline-block; max-width: 170px; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; vertical-align: bottom;
}
.ro-up { color: var(--jade); font-weight: 700; }
.ro-down { color: var(--charcoal); font-weight: 700; }
.row-actions { display: flex; gap: 6px; }
.mini-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; border-radius: 7px; border: 1px solid var(--border);
  background: #fff; color: var(--blue); cursor: pointer;
}
.mini-btn:hover { border-color: var(--seafoam); color: var(--jade); }
.mini-btn.danger:hover { border-color: var(--raspberry); color: var(--raspberry); }
.count-line { font-size: 13px; color: var(--dim); margin: 0 0 10px; }
.empty {
  padding: 26px; text-align: center; color: var(--dim);
  background: var(--gray); border-radius: 10px; font-size: 14px;
}
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 12px; }
.filters .field { min-width: 130px; flex: 0 1 auto; }
.filters .field.grow { flex: 1 1 180px; }

/* ---------------- Badges ---------------- */
.badge {
  display: inline-block; padding: 2px 9px; border-radius: 999px;
  font-size: 11px; font-weight: 700; letter-spacing: .3px; white-space: nowrap;
}
.b-q1 { background: var(--sea20); color: var(--jade); }
.b-q2 { background: #E6EEF3; color: var(--blue); }
.b-q3 { background: rgba(251, 202, 24, .22); color: #7a6200; }
.b-q4 { background: #F8E0E7; color: var(--raspberry); }
.b-prod { background: var(--sea20); color: var(--jade); }
.b-conge { background: var(--gray); color: var(--charcoal); }
.b-dispo { background: #E6EEF3; color: var(--blue); }

/* ---------------- Cartes d'activité (tableau de bord) ---------------- */
.act-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(235px, 1fr)); gap: 14px; margin-bottom: 18px; }
.act-card { border-top: 3px solid var(--seafoam); margin-bottom: 0; display: flex; flex-direction: column; gap: 8px; }
.act-name { font-size: 17px; font-weight: 800; color: var(--midnight); }
.act-meta { font-size: 12px; color: var(--dim); }
.act-stats { display: flex; gap: 18px; padding: 8px 0; }
.act-stats div { display: flex; flex-direction: column; }
.act-stats b { font-size: 20px; color: var(--jade); }
.act-stats span { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .4px; }
.act-sup { font-size: 12.5px; color: var(--charcoal); }
.act-card .btn { align-self: flex-start; margin-top: auto; }
.info-card { background: var(--sea10); border-color: var(--sea20); }
.info-card p { margin: 6px 0 0; font-size: 13.5px; }

/* ---------------- Page module en construction ---------------- */
.todo { display: flex; gap: 16px; align-items: flex-start; }
.todo-ic {
  width: 46px; height: 46px; border-radius: 12px; flex: 0 0 auto;
  background: var(--sea20); color: var(--jade);
  display: inline-flex; align-items: center; justify-content: center;
}
.todo-badge {
  display: inline-block; background: var(--blue); color: #fff; border-radius: 999px;
  font-size: 11px; font-weight: 700; padding: 3px 10px; letter-spacing: .5px; margin-left: 8px;
  vertical-align: middle;
}
.todo ul { margin: 10px 0 0; padding-left: 20px; }
.todo li { margin-bottom: 6px; font-size: 14px; }
.todo .src { margin-top: 12px; font-size: 12.5px; color: var(--dim); }

/* ---------------- Chips résumé (compactes et alignées en grille) ---------------- */
.chips {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 8px; margin-bottom: 12px;
}
.chip {
  background: var(--sea10); border: 1px solid var(--sea20); color: var(--jade);
  border-radius: 8px; padding: 5px 10px; font-size: 11px; font-weight: 600;
  display: flex; flex-direction: column; min-width: 0;
}
.chip b { font-size: 14px; line-height: 1.25; }

/* ---------------- Toast ---------------- */
.toast {
  position: fixed; left: 50%; bottom: 18px; transform: translate(-50%, 20px);
  background: var(--midnight); color: var(--seafoam); padding: 11px 20px;
  border-radius: 10px; font-size: 14px; font-weight: 600; opacity: 0;
  pointer-events: none; transition: all .25s ease; z-index: 90; max-width: 90vw;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------------- Divers ---------------- */
.ic { flex: 0 0 auto; }
.note { font-size: 12.5px; color: var(--dim); }
.file-label { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; }

@media (max-width: 640px) {
  .main { padding: calc(var(--topbar-h) + 14px) 12px 30px; }
  .brand-sub, .act-label { display: none; }
  .act-wrap select { max-width: 150px; font-size: 13px; }
  .card { padding: 14px; }
  .form-grid { grid-template-columns: 1fr 1fr; }
  .adv-block .form-grid { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 420px) {
  .form-grid { grid-template-columns: 1fr; }
}

/* ---------------- Accueil : choix du projet de destination ---------------- */
body.on-accueil .top-right,
body.on-accueil #btnMenu,
body.on-accueil .sidebar,
body.on-accueil .backdrop { display: none !important; }

.welcome { max-width: 920px; margin: 0 auto; padding: clamp(20px, 5vh, 56px) 4px 40px; }
.welcome-hero { text-align: center; margin-bottom: 26px; }
.welcome-logo { width: 56px; height: 56px; margin: 0 auto 14px; }
.welcome-logo svg { width: 100%; height: 100%; display: block; }
.welcome-hero h1 { font-size: clamp(1.5rem, 4.5vw, 2.1rem); margin: 0 0 8px; color: var(--midnight); }
.welcome-hero p { margin: 0; color: var(--dim); font-size: 15.5px; }
.welcome-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 680px) { .welcome-cards { grid-template-columns: 1fr; } }
.welcome-card {
  display: block; width: 100%; text-align: left; font-family: inherit;
  background: var(--white); border: 1px solid var(--border); border-top: 4px solid var(--accent, var(--jade));
  border-radius: 14px; padding: 18px 18px 16px; cursor: pointer; box-shadow: var(--shadow);
  transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
}
.welcome-card:hover { transform: translateY(-2px); border-color: var(--accent, var(--jade)); box-shadow: 0 6px 18px rgba(0, 32, 50, .12); }
.welcome-card:focus-visible { outline: 3px solid var(--seafoam); outline-offset: 2px; }
.welcome-card h2 { margin: 0 0 4px; font-size: 18px; color: var(--midnight); }
.welcome-card .w-desc { margin: 0 0 12px; font-size: 13.5px; color: var(--dim); }
.welcome-note { text-align: center; color: var(--dim); font-size: 13px; margin-top: 22px; }

/* ---------------- Tableau de bord interactif ---------------- */
.dash-controls { display: flex; flex-wrap: wrap; gap: 10px 12px; margin: 0 0 16px; align-items: center; }
input[type="checkbox"] { accent-color: var(--jade); }
.msel { position: relative; }
.msel-btn {
  display: inline-flex; align-items: center; gap: 8px; background: var(--white);
  border: 1px solid var(--border); border-radius: 10px; padding: 7px 12px;
  font-size: 13px; cursor: pointer; box-shadow: var(--shadow);
}
.msel-btn:hover { border-color: var(--jade); }
.msel-tag { font-size: 10.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--dim); font-weight: 700; }
.msel-val { font-size: 13px; color: var(--midnight); font-weight: 600; }
.msel-btn .chev { color: var(--dim); display: inline-flex; transition: transform .15s; }
.msel.open .chev { transform: rotate(180deg); }
.msel-panel {
  display: none; position: absolute; top: calc(100% + 6px); left: 0; z-index: 30;
  background: var(--white); border: 1px solid var(--border); border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0, 32, 50, .18); padding: 8px;
  min-width: 230px; max-height: 300px; overflow-y: auto;
}
.msel.open .msel-panel { display: block; }
.msel-all {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px; font-size: 13px;
  font-weight: 700; color: var(--midnight); border-bottom: 1px solid var(--border);
  margin-bottom: 4px; cursor: pointer;
}
.msel-opt { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px; font-size: 13.5px; cursor: pointer; }
.msel-opt:hover { background: var(--sea10); }
.msel-opt.dim span { color: var(--dim); }
.msel-n { font-style: normal; font-size: 11px; background: var(--gray); color: var(--dim); border-radius: 999px; padding: 1px 7px; margin-left: auto; }
.dash-reset {
  display: inline-flex; align-items: center; gap: 6px; border: none; background: none;
  color: var(--jade); font-size: 12.5px; font-weight: 700; cursor: pointer; padding: 8px 6px;
}
.dash-reset:hover { color: var(--midnight); }
.gauge-row { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
@media (max-width: 900px) { .gauge-row { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 560px) { .gauge-row { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.gauge-card {
  background: var(--white); border: 1px solid var(--border); border-radius: 12px;
  box-shadow: var(--shadow); padding: 12px 8px 10px; text-align: center;
}
.gauge-card .g-svg { width: 84px; height: 84px; }
.gauge-card.half .g-svg { width: 112px; height: 65px; }
.g-label { font-size: 11px; font-weight: 700; color: var(--midnight); text-transform: uppercase; letter-spacing: .3px; line-height: 1.3; margin-top: 6px; }
.g-hint { font-size: 10.5px; color: var(--dim); margin-top: 2px; }
.dash-duo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
@media (max-width: 760px) { .dash-duo { grid-template-columns: 1fr; } }
.bar-chart { display: flex; align-items: flex-end; gap: 22px; min-height: 165px; padding-top: 20px; overflow-x: auto; }
.bar-group { text-align: center; flex: 0 0 auto; }
.bar-pair { display: flex; gap: 6px; align-items: flex-end; height: 130px; }
.vbar { width: 30px; border-radius: 6px 6px 0 0; position: relative; min-height: 3px; }
.vbar.clt { background: var(--blue); }
.vbar.cnx { background: var(--seafoam); }
.vbar span {
  position: absolute; top: -18px; left: 50%; transform: translateX(-50%);
  font-size: 11px; font-weight: 700; color: var(--midnight); white-space: nowrap;
}
.bar-mois { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--dim); margin-top: 6px; }
.stk { display: flex; align-items: flex-end; gap: 22px; min-height: 175px; padding-top: 22px; overflow-x: auto; }
.stk-total { font-size: 12px; font-weight: 700; color: var(--midnight); margin-bottom: 4px; }
.stk-col { display: flex; flex-direction: column; justify-content: flex-end; width: 52px; margin: 0 auto; }
.stk-seg { width: 100%; }

.dmt-report {

}
.dmt-report ul { margin: 8px 0 0; padding-left: 18px; }
.dmt-report li { margin-bottom: 4px; }
.chart-box { overflow-x: auto; }
.chart-box svg { display: block; width: 100%; height: auto; min-width: 540px; }
.chart-duo { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 22px; }
.chart-duo > div { min-width: 0; }
.duo-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.duo-head .duo-title { margin: 0; }
.btn-zoom {
  border: none; background: var(--sea10); color: var(--midnight);
  width: 26px; height: 26px; border-radius: 7px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto;
}
.btn-zoom:hover { background: var(--sea20); }
/* Zoom plein écran (graphique ou tableau) */
.zoom-overlay {
  position: fixed; inset: 0; background: rgba(4, 18, 30, .62);
  display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 95;
}
.zoom-box {
  background: var(--white); color: var(--midnight); border-radius: 14px; width: 100%;
  max-width: min(1180px, 96vw); max-height: 92vh; overflow: auto; padding: 18px 20px;
}
.zoom-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.zoom-head h2 { margin: 0; font-size: 17px; flex: 1; }
.zoom-close {
  border: none; background: var(--sea10); color: var(--midnight);
  width: 32px; height: 32px; border-radius: 8px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto;
}
.zoom-close:hover { background: var(--sea20); }
/* Filtres Scorecard collants : la barre reste visible en haut pendant le
   défilement de la section Scorecard (uniquement cette page) */
.sc-filters {
  position: sticky; top: calc(var(--topbar-h) + 8px); z-index: 35;
  box-shadow: 0 4px 14px rgba(0, 32, 50, 0.12);
}
.chart-duo .duo-title {
  margin: 0 0 4px; font-size: 13px; font-weight: 700; letter-spacing: .05em;
  text-transform: uppercase; color: var(--midnight);
}
.chart-duo .duo-sub { margin: 0 0 8px; font-size: 12px; color: var(--dim); }
.chart-duo .chart-box svg { min-width: 0; }
.chart-box.wide svg { min-width: 540px; }
.dmt-legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 10px; font-size: 12px; color: var(--dim); }
.dmt-legend i {
  width: 12px; height: 12px; border-radius: 3px; display: inline-block;
  margin-right: 6px; vertical-align: -1px; flex: 0 0 auto;
}
.dmt-ok { color: var(--jade); font-weight: 700; }
.dmt-ko { color: var(--raspberry); font-weight: 700; }
/* Boutons de périodicité (page Analyse) */
.seg { display: flex; gap: 8px; flex-wrap: wrap; }
.seg .btn { min-width: 0; }
.seg .btn-primary { background: var(--midnight); border-color: var(--midnight); color: #fff; }
table.dmt { min-width: 540px; }
.dmt-mat-input {
  width: 140px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px;
  font-size: 13px; text-align: left; color: var(--charcoal); background: #fff; font-family: inherit;
}
.dmt-mat-input:focus { outline: 2px solid var(--seafoam); border-color: var(--seafoam); }
/* Focus joignabilité : camembert des raisons d'échanges */
.ana-split { display: flex; align-items: center; gap: 26px; flex-wrap: wrap; margin-top: 12px; }
.ana-split svg { flex: 0 0 auto; width: 190px; height: 190px; max-width: 100%; }
.rai-legend { list-style: none; margin: 0; padding: 0; flex: 1 1 260px; min-width: 230px; display: grid; gap: 7px; }
.rai-legend li { display: flex; align-items: baseline; gap: 8px; font-size: 13px; }
.rai-legend i { flex: 0 0 12px; height: 12px; border-radius: 3px; align-self: center; }
.rai-legend span { flex: 1 1 auto; color: var(--midnight); }
.rai-legend b { font-weight: 700; color: var(--midnight); font-variant-numeric: tabular-nums; }
.rai-legend em { font-style: normal; color: var(--dim); font-size: 12px; min-width: 54px; text-align: right; }
/* Focus joignabilité : barres par secteur */
.sec-list { display: grid; gap: 8px; margin-top: 14px; }
.sec-row { display: grid; grid-template-columns: 132px 1fr 72px 62px; align-items: center; gap: 10px; font-size: 12.5px; }
.sec-label { color: var(--midnight); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

@media (max-width: 640px) {
  .sec-row { grid-template-columns: 96px 1fr 58px 56px; font-size: 11.5px; gap: 7px; }
}
/* Focus joignabilité : les 4 graphiques côte à côte, disposés deux par deux
   (grille 2 colonnes — repasse sur 1 colonne quand l'écran est trop étroit,
   y compris quand la barre latérale est ouverte). */
.ana-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(430px, 100%), 1fr));
  gap: 16px; margin-bottom: 18px; align-items: stretch;
}
.ana-grid .card { margin-bottom: 0; min-width: 0; }
/* Le graphique combiné s'adapte à la demi-largeur (zoom disponible via la loupe) */
.ana-grid .chart-box svg { min-width: 0; }
/* Dans la grille, les tableaux s'ajustent à la demi-largeur au lieu de déclencher
   une barre de défilement horizontale (4 colonnes compactes). */
.ana-grid table.dmt { min-width: 0; }
/* ---------- Planning ---------- */
.pl-t { font-variant-numeric: tabular-nums; white-space: nowrap; }
.pl-d { color: var(--dim); font-size: 11px; margin-top: 1px; white-space: nowrap; }

.pl-rs { color: var(--dim); font-size: 12px; white-space: nowrap; }

  border: 1px solid var(--border); border-radius: 10px; padding: 7px 12px;

.pl-sum th:first-child, .pl-sum td:first-child { text-align: left; }
/* Planning compact : tableaux denses, import repliable, recherche de filtres */
#plRoot table.dmt thead th { padding: 6px 8px; font-size: 10.5px; }
#plRoot table.dmt tbody td { padding: 4px 8px; font-size: 12px; }
#plRoot .card { padding: 14px 16px; margin-bottom: 14px; }

.pl-msg.pl-err { color: var(--raspberry); }
.pl-chips { margin: -4px 0 12px; }
details.pl-import summary { cursor: pointer; font-size: 15px; font-weight: 600; color: var(--midnight);
  display: flex; align-items: center; gap: 8px; list-style: none; }
details.pl-import summary::-webkit-details-marker { display: none; }
details.pl-import summary::before { content: "+"; color: var(--jade); font-weight: 700; }
details.pl-import[open] summary::before { content: "–"; }
.msel-search { width: 100%; margin: 2px 0 6px; padding: 6px 9px; border: 1px solid var(--border);
  border-radius: 8px; font-size: 12.5px; font-family: inherit; background: var(--white); color: var(--charcoal); }
.msel-search:focus { outline: none; border-color: var(--jade); }

/* ============================================================
   Micro-interactions — effet de clic (ripple), pression au clic,
   survols animés, infobulle qui suit le curseur et animation
   d'entrée de page. Désactivées si le système demande des
   animations réduites (prefers-reduced-motion).
   ============================================================ */
/* Conteneurs compatibles ripple (le disque est ajouté en JS au pointerdown) */
.btn, .icon-btn, .mini-btn, .nav-item, .nav-group-head, .msel-btn,
.btn-zoom, .zoom-close, .dash-reset, .msel-all, .msel-opt, .pl-x, .welcome-card {
  position: relative; overflow: hidden;
}
.ripple {
  position: absolute; border-radius: 50%; background: currentColor;
  opacity: .22; pointer-events: none; transform: scale(0);
  animation: boRipple .45s ease-out forwards;
}
@keyframes boRipple { to { transform: scale(1); opacity: 0; } }

/* Pression au clic : l'élément s'enfonce légèrement */
.btn, .icon-btn, .mini-btn, .msel-btn, .btn-zoom, .zoom-close, .dash-reset,
.nav-item, .nav-group-head, .welcome-card, .gauge-card, .pl-x {
  transition: transform .12s ease, box-shadow .18s ease, background-color .15s ease,
    border-color .15s ease, color .15s ease;
}
.btn:active, .icon-btn:active, .mini-btn:active, .msel-btn:active,
.btn-zoom:active, .zoom-close:active, .dash-reset:active,
.nav-item:active, .nav-group-head:active { transform: scale(.96); }
.pl-x:active { transform: scale(.88); }

/* Survol des boutons : légère élévation */
.btn-primary:hover, .btn-ghost:hover, .btn-danger:hover {
  transform: translateY(-1px); box-shadow: 0 3px 10px rgba(0, 32, 50, .16);
}
.btn-primary:active, .btn-ghost:active, .btn-danger:active {
  transform: scale(.97); box-shadow: none;
}
.btn-zoom:hover, .zoom-close:hover, .mini-btn:hover { transform: scale(1.08); }
.msel-btn:hover { border-color: var(--jade); box-shadow: 0 2px 8px rgba(0, 32, 50, .10); transform: translateY(-1px); }
.msel-btn:active { transform: scale(.97); }

/* Cartes-tuiles (jauge KPI, cartes d'activité) : élévation au survol */
.gauge-card:hover, .act-card:hover {
  transform: translateY(-2px); border-color: var(--seafoam);
  box-shadow: 0 6px 16px rgba(0, 32, 50, .12);
}
.card { transition: border-color .18s ease, box-shadow .18s ease; }
.card:hover { border-color: #cfdde6; box-shadow: 0 2px 8px rgba(0, 32, 50, .10); }

/* Tableaux et menus déroulants : réaction douce */
tbody tr { transition: background-color .12s ease; }
.msel-opt, .msel-all { transition: background-color .12s ease; }

/* Clavier : anneau de focus visible et cohérent */
.nav-item:focus-visible, .nav-group-head:focus-visible, .btn:focus-visible,
.icon-btn:focus-visible, .mini-btn:focus-visible, .msel-btn:focus-visible,
.dash-reset:focus-visible, .msel-opt:focus-visible {
  outline: 2px solid var(--seafoam); outline-offset: 1px;
}

/* Animation d'entrée de page (relancée à chaque navigation) */
@keyframes boPageIn { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
.main.page-in { animation: boPageIn .26s ease; }

/* Infobulle qui suit le curseur (élément .cursor-tip créé par core.js) */
.cursor-tip {
  position: fixed; left: 0; top: 0; z-index: 100; max-width: 280px;
  background: var(--midnight); color: var(--seafoam);
  font-size: 12.5px; font-weight: 600; line-height: 1.35;
  padding: 7px 11px; border-radius: 9px;
  box-shadow: 0 6px 18px rgba(0, 32, 50, .3);
  pointer-events: none; white-space: normal;
}
.cursor-tip[hidden] { display: none; }
@keyframes boTipIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
.cursor-tip:not([hidden]) { animation: boTipIn .15s ease; }

/* Accessibilité : on respecte la préférence « animations réduites » */
@media (prefers-reduced-motion: reduce) {
  .ripple { display: none; }
  .main.page-in, .cursor-tip:not([hidden]) { animation: none; }
  * { transition-duration: .01ms !important; }
}

      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];

}
function num(v) {
  if (v === "" || v === null || v === undefined) return null;
  const n = Number(String(v).replace(",", "."));
  return isNaN(n) ? null : n;
}
function round4(x) { return Math.round(x * 10000) / 10000; }
function fmtFr(v, dec) {
  const n = num(v);
  if (n === null) return "";
  const d = (dec === undefined) ? 2 : dec;
  return n.toFixed(d).replace(".", ",");
}
function fmtSmart(v) {
  const n = num(v);
  if (n === null) return "";
  return Number.isInteger(n) ? String(n) : fmtFr(n, 2);
}
function fmtPct(v) {
  const n = num(v);
  if (n === null) return "";
  return Math.round(n * 100) + " %";

function uniq(list) {
  const seen = {}; const out = [];
  list.forEach(function (x) { const k = String(x); if (!seen[k]) { seen[k] = 1; out.push(x); } });

/* ---------- Calculs : mêmes formules que le fichier Excel ---------- */
function roKpi(type, target, realise) {
  const t = num(target), r = num(realise);
  if (t === null || r === null || t === 0) return null;
  if (String(type || "").toUpperCase() === "ASCENDANT") return r / t;
  return r > t * 2 ? t / r : 2 - r / t;
}
function quartileOf(ro1, ro2) {
  if (ro1 === null || ro2 === null) return "";
  const a = ro1 >= 1, b = ro2 >= 1;
  if (a && b) return "Q1";
  if (a && !b) return "Q3";
  if (!a && b) return "Q2";
  return "Q4";
}
function fillSumPct(row, iNB, iPct, iA, iB, total) {
  const a = num(row[iA]), b = num(row[iB]);
  if (a === null && b === null) { row[iNB] = ""; row[iPct] = ""; return; }
  const s = (a || 0) + (b || 0);
  row[iNB] = s;
  row[iPct] = (total && total > 0) ? round4(s / total) : "";
}
function pctOf(row, iNB, iTot, iPct) {
  const n = num(row[iNB]), t = num(row[iTot]);
  row[iPct] = (n !== null && t) ? round4(n / t) : "";
}
/* Projections calculées depuis la Config FDR (référence = mois du flux) :
   28 = PROJECTION % ADV CLT TARGET 1&2 (OT Kpi1&2 ÷ effectif cartographié)
   29 = PROJECTION NB ADV CLT TARGET 1&2 (OT Kpi1&2 du mois)
   30 = ECART A LA PROJECTION (NB réel sur target client − projection)
   31 = NB ADV ON WH TARGET KPI 1 & 2 (objectif de travail OT Kpi1&2 du mois) */
function syncProjections(row) {
  const fr = (store.data.fdr || []).find(function (r) { return r.fluxId === row[6] && r.mois === row[7]; });
  if (!fr) { row[28] = ""; row[29] = ""; row[30] = ""; row[31] = ""; return; }
  const ot12 = num(fr.v[3]), eff = num(fr.v[0]);
  row[29] = ot12 !== null ? ot12 : "";
  row[31] = row[29];
  row[28] = (ot12 !== null && eff) ? round4(ot12 / eff) : "";
  const act = num(row[26]);
  row[30] = (ot12 !== null && act !== null) ? round4(act - ot12) : "";
}
function completeRow(row) {
  const ro1 = roKpi(row[13], row[11], row[12]);
  const ro2 = roKpi(row[18], row[16], row[17]);
  row[14] = ro1 === null ? "" : round4(ro1);
  row[19] = ro2 === null ? "" : round4(ro2);
  row[20] = (ro1 !== null && ro2 !== null) ? round4((ro1 + ro2) / 2) : "";
  row[9] = quartileOf(ro1, ro2);
  const a3 = num(row[33]), ap3 = num(row[40]);
  const adv = (a3 !== null || ap3 !== null) ? (a3 || 0) + (ap3 || 0) : null;
  row[21] = adv === null ? "" : adv;
  fillSumPct(row, 22, 23, 34, 41, adv);
  fillSumPct(row, 24, 25, 36, 43, adv);
  fillSumPct(row, 26, 27, 38, 45, adv);
  pctOf(row, 34, 33, 35); pctOf(row, 36, 33, 37); pctOf(row, 38, 33, 39);
  pctOf(row, 41, 40, 42); pctOf(row, 43, 40, 44); pctOf(row, 45, 40, 46);
  pctOf(row, 48, 47, 49); pctOf(row, 50, 47, 51); pctOf(row, 52, 47, 53);
  syncProjections(row);
  const wh = num(row[31]);
  row[32] = (wh !== null && adv) ? round4(wh / adv) : "";
  return row;
}

/* ---------- Stockage local (navigateur) ---------- */
const store = {
  KEY: "boite_outils_superviseur_v1",
  data: { activityId: DATA.activities[0].id, entries: [] },
  seedFdr() {
    return window.APP_DATA.fdr.map(function (r) {
      return { id: r.id, fluxId: r.fluxId, mois: r.mois, v: r.v.slice() };
    });
  },
  seed() {
    const entries = window.APP_HISTORY.map(function (row, i) { return { id: "h" + (i + 1), row: row.slice() }; });
    this.data = { activityId: DATA.activities[0].id, entries: entries, fdr: this.seedFdr(),
      dmt: { matricules: {}, agg: {}, imports: [] },
      satcli: { vals: {}, dates: {} }, joign: { agg: {}, imports: [], total: 0 } };
    entries.forEach(function (e) { completeRow(e.row); });
  },
  load() {
    let raw = null;
    try { raw = localStorage.getItem(this.KEY); } catch (e) { raw = null; }
    let parsed = null;
    if (raw) {
      try {
        const d = JSON.parse(raw);
        if (d && Array.isArray(d.entries)) parsed = d;
      } catch (e) { /* données corrompues : on repart des données d'origine */ }
    }
    if (parsed) {
      this.data = {
        activityId: parsed.activityId || DATA.activities[0].id,
        entries: parsed.entries.filter(function (e) { return e && Array.isArray(e.row) && e.row.length === 54; }),
        fdr: null
      };
      const f = Array.isArray(parsed.fdr)
        ? parsed.fdr.filter(function (r) { return r && r.fluxId && Array.isArray(r.v) && r.v.length === 8; })
        : [];
      this.data.fdr = f.length ? f : this.seedFdr();
      this.data.dmt = {
        matricules: parsed.dmt && parsed.dmt.matricules ? parsed.dmt.matricules : {},
        agg: parsed.dmt && parsed.dmt.agg ? parsed.dmt.agg : {},
        imports: parsed.dmt && Array.isArray(parsed.dmt.imports) ? parsed.dmt.imports : []
      };
      /* SATCLI (saisies MTD) et joignabilité (agrégat jour + agent) :
         restaurées aussi, sinon perdues au rechargement de la page. */
      this.data.satcli = parsed.satcli || { vals: {}, dates: {} };
      this.data.joign = parsed.joign || { agg: {}, imports: [], total: 0 };
    } else {
      this.seed();
    }
    this.recalcAll();
  },
  recalcAll() {
    this.data.entries.forEach(function (e) { if (e && Array.isArray(e.row)) completeRow(e.row); });
    this.save();
  },
  save() {
    this.data.savedAt = new Date().toISOString();
    try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); }
    catch (e) { toast("Attention : enregistrement local impossible (mode privé ?)"); }
  },
  setActivity(id) {
    this.data.activityId = id;
    this.save();
  },
  upsert(entry) {
    const i = this.data.entries.findIndex(function (e) { return e.id === entry.id; });
    if (i >= 0) this.data.entries[i] = entry; else this.data.entries.push(entry);
    this.save();
  },
  remove(id) {
    this.data.entries = this.data.entries.filter(function (e) { return e.id !== id; });
    this.save();
  },
  forActivity(actId) {
    return this.data.entries.filter(function (e) {
      const a = activityOfRow(e.row);
      return a && a.id === actId;
    });
  },
  fdrForActivity(actId) {
    const act = DATA.activities.find(function (a) { return a.id === actId; });
    const ids = act ? act.flows.map(function (f) { return f.id; }) : [];
    return this.data.fdr.filter(function (r) { return ids.indexOf(r.fluxId) >= 0; });
  },
  setFdrValue(rowId, idx, value) {
    const row = this.data.fdr.find(function (r) { return r.id === rowId; });
    if (!row) return;
    row.v[idx] = value;
    this.recalcAll();
  }
};

/* ---------- Export de fichiers ---------- */
function downloadFile(name, content, mime) {
  const blob = new Blob([content], { type: mime || "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 600);
}
function csvCell(v) {
  let s = v === null || v === undefined ? "" : String(v);
  if (typeof v === "number") s = String(v).replace(".", ",");
  if (/[;"\r\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function csvFromRows(headers, rows) {
  const lines = [headers.map(csvCell).join(";")];
  rows.forEach(function (r) { lines.push(r.map(csvCell).join(";")); });
  return "\uFEFF" + lines.join("\r\n");
}

/* ---------- Toast (message temporaire) ---------- */
let toastTimer = null;
function toast(msg) {
  const t = $("#toast");
  if (!t) return;
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2600);
}

/* ---------- Micro-interactions ----------
   Infobulle qui suit le curseur (attribut data-tip ; les attributs title
   existants sont convertis au rendu pour éviter le double affichage natif)
   et effet de pression au clic (ripple) sur les éléments interactifs. */
let tipEl = null, tipTarget = null;
function tipMove(e) {
  if (!tipEl || tipEl.hidden) return;
  const pad = 14;
  const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  let x = e.clientX + pad, y = e.clientY + 18;
  if (x + w > window.innerWidth - 8) x = Math.max(8, e.clientX - w - pad);
  if (y + h > window.innerHeight - 8) y = Math.max(8, e.clientY - h - 12);
  tipEl.style.left = x + "px";
  tipEl.style.top = y + "px";
}
function tipHide() {
  if (tipEl) tipEl.hidden = true;
  tipTarget = null;
}
function tipShowFor(target, e) {
  const text = target.getAttribute("data-tip");
  if (!text) return;
  if (!tipEl) {
    tipEl = document.createElement("div");
    tipEl.className = "cursor-tip";
    tipEl.setAttribute("role", "tooltip");
    tipEl.hidden = true;
    document.body.appendChild(tipEl);
  }
  tipEl.textContent = text;
  tipEl.hidden = false;
  tipTarget = target;
  tipMove(e);
}
function initCursorTip() {
  document.addEventListener("pointerover", function (e) {
    if (e.pointerType === "touch") return;
    const t = e.target && e.target.closest ? e.target.closest("[data-tip]") : null;
    if (t) { tipTarget = t; tipShowFor(t, e); } else { tipHide(); }
  });
  document.addEventListener("pointermove", function (e) {
    if (e.pointerType === "touch") return;
    if (tipTarget && tipEl && !tipEl.hidden) tipMove(e);
  });
  document.addEventListener("pointerout", function (e) {
    if (!e.relatedTarget) tipHide();
  });
  document.addEventListener("pointerdown", tipHide, true);
  window.addEventListener("blur", tipHide);
  document.addEventListener("scroll", tipHide, true);
}
/* Convertit les attributs title en data-tip au fil des rendus. */
function syncTitleTips() {
  $all("[title]").forEach(function (el) {
    const t = el.getAttribute("title");
    el.removeAttribute("title");
    if (!el.hasAttribute("data-tip")) el.setAttribute("data-tip", t);
  });
}
function initRipple() {
  const SEL = ".btn, .icon-btn, .mini-btn, .nav-item, .nav-group-head, .msel-btn, " +
    ".btn-zoom, .zoom-close, .dash-reset, .msel-all, .msel-opt, .pl-x, .welcome-card";
  document.addEventListener("pointerdown", function (e) {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const el = e.target && e.target.closest ? e.target.closest(SEL) : null;
    if (!el || el.disabled) return;
    const rect = el.getBoundingClientRect();
    const d = Math.max(rect.width, rect.height) * 2.2;
    const s = document.createElement("span");
    s.className = "ripple";
    s.style.width = s.style.height = d + "px";
    s.style.left = (e.clientX - rect.left - d / 2) + "px";
    s.style.top = (e.clientY - rect.top - d / 2) + "px";
    el.appendChild(s);
    s.addEventListener("animationend", function () { s.remove(); });
    setTimeout(function () { if (s.parentNode) s.remove(); }, 800);
  });
}

const ROUTES = {};
function currentRoute() {
  return location.hash.replace(/^#\/?/, "") || "accueil";
}
function navigate() {
  const id = currentRoute();
  const accueil = id === "accueil";
  document.body.classList.toggle("on-accueil", accueil);
  if (accueil) {
    document.body.classList.remove("sidebar-open");
  } else if (window.innerWidth >= 1024) {
    document.body.classList.add("sidebar-open");
  }
  renderSidebar(id);
  // Resynchronise le sélecteur d'activité en haut (ex : projet choisi sur l'accueil)
  const sel = $("#selActivity");
  if (sel && sel.value !== store.data.activityId) sel.value = store.data.activityId;
  const main = $("#main");
  const fn = ROUTES[id];
  tipHide();
  if (fn) { fn(main); } else { ROUTES["dashboard"](main); }
  syncTitleTips();
  /* Animation d'entrée de la page (relancée à chaque navigation). */
  main.classList.remove("page-in");
  void main.offsetWidth;
  main.classList.add("page-in");
  window.scrollTo(0, 0);
}

/* ============================================================
   TABLEAU DE BORD — interactif (segments + graphiques)
   ============================================================ */
let dashState = null;
let dashDocBound = false;

let dashSig = null;
function dashEnsureState() {
  // Les filtres se resynchronisent automatiquement dès que les données Update_perf changent
  const entries = store.data.entries;
  const sig = entries.length + "|" +
    uniq(entries.map(function (e) { const a = activityOfRow(e.row); return a ? a.id : ""; }).filter(Boolean)).sort().join(",") + "|" +
    uniq(entries.map(function (e) { return e.row[7]; }).filter(Boolean))
      .sort(function (a, b) { return MONTHS.indexOf(a) - MONTHS.indexOf(b); }).join(",") + "|" +
    uniq(entries.map(function (e) { return String(e.row[8] || ""); }).filter(Boolean))
      .sort(function (a, b) { return parseInt(a.slice(1), 10) - parseInt(b.slice(1), 10); }).join(",");
  if (dashState && sig === dashSig) return;
  dashSig = sig;
  dashState = {
    acts: DATA.activities.map(function (a) { return a.id; }),
    mois: uniq(entries.map(function (e) { return e.row[7]; }).filter(Boolean))
      .sort(function (a, b) { return MONTHS.indexOf(a) - MONTHS.indexOf(b); }),
    sems: uniq(entries.map(function (e) { return String(e.row[8] || ""); }).filter(Boolean))
      .sort(function (a, b) { return parseInt(a.slice(1), 10) - parseInt(b.slice(1), 10); })
  };
}
const DASH_MOIS_SHORT = {
  "JANVIER": "JAN", "FÉVRIER": "FÉV", "MARS": "MAR", "AVRIL": "AVR", "MAI": "MAI",
  "JUIN": "JUN", "JUILLET": "JUL", "AOÛT": "AOÛ", "SEPTEMBRE": "SEP",
  "OCTOBRE": "OCT", "NOVEMBRE": "NOV", "DÉCEMBRE": "DÉC"
};

function dashSum(rows, idx) {
  let s = 0, any = false;
  rows.forEach(function (e) {
    const v = num(e.row[idx]);
    if (v !== null) { s += v; any = true; }
  });
  return any ? s : null;
}
function dashPct(n, d) {
  if (n === null || d === null || !d) return null;
  return Math.round(1000 * n / d) / 10;
}
function dashAvg(rows, idx) {
  let s = 0, c = 0;
  rows.forEach(function (e) {
    const v = num(e.row[idx]);
    if (v !== null) { s += v; c++; }
  });
  return c ? s / c : null;
}
function dashGaugeColor(p) {
  return p === null ? "var(--dim)" : p >= 100 ? "var(--jade)" : p >= 50 ? "var(--blue)" : "var(--raspberry)";
}

function dashDonut(pct, caption, hint) {
  const p = pct === null ? 0 : Math.max(0, Math.min(100, pct));
  const r = 32, c = 2 * Math.PI * r;
  const val = pct === null ? "—" : Math.round(pct) + "%";
  return '<div class="gauge-card">' +
    '<svg viewBox="0 0 84 84" class="g-svg" role="img" aria-label="' + esc(caption) + " " + val + '">' +
    '<circle cx="42" cy="42" r="' + r + '" fill="none" stroke="var(--sea20)" stroke-width="11"/>' +
    '<circle cx="42" cy="42" r="' + r + '" fill="none" stroke="' + dashGaugeColor(pct) + '" stroke-width="11" stroke-linecap="round" ' +
    'stroke-dasharray="' + (p / 100 * c).toFixed(1) + " " + c.toFixed(1) + '" transform="rotate(-90 42 42)"/>' +
    '<text x="42" y="48" text-anchor="middle" font-size="17" font-weight="700" fill="var(--midnight)">' + val + "</text>" +
    "</svg>" +
    '<div class="g-label">' + esc(caption) + "</div>" +
    (hint ? '<div class="g-hint">' + esc(hint) + "</div>" : "") +
    "</div>";
}

function dashHalf(pct, caption, hint) {
  const LEN = Math.PI * 40;
  const p = pct === null ? 0 : Math.max(0, Math.min(200, pct));
  const val = pct === null ? "—" : Math.round(pct) + "%";
  return '<div class="gauge-card half">' +
    '<svg viewBox="0 0 100 58" class="g-svg" role="img" aria-label="' + esc(caption) + " " + val + '">' +
    '<path d="M 10 52 A 40 40 0 0 1 90 52" fill="none" stroke="var(--sea20)" stroke-width="12" stroke-linecap="round"/>' +
    '<path d="M 10 52 A 40 40 0 0 1 90 52" fill="none" stroke="' + dashGaugeColor(pct) + '" stroke-width="12" stroke-linecap="round" ' +
    'stroke-dasharray="' + (p / 200 * LEN).toFixed(1) + " " + LEN.toFixed(1) + '"/>' +
    '<text x="50" y="50" text-anchor="middle" font-size="16" font-weight="700" fill="var(--midnight)">' + val + "</text>" +
    "</svg>" +
    '<div class="g-label">' + esc(caption) + "</div>" +
    (hint ? '<div class="g-hint">' + esc(hint) + "</div>" : "") +
    "</div>";
}

function dashLegend(items) {
  return '<div class="dash-legend">' + items.map(function (it) {
    return '<span><i class="dash-dot" style="background:' + it[1] + '"></i>' + esc(it[0]) + "</span>";
  }).join("") + "</div>";
}

function dashAtteinteChart(byMonth) {
  const MAXH = 130;
  let groups = byMonth.map(function (m) {
    function bar(val, cls) {
      const h = val === null ? 3 : Math.max(3, Math.min(100, val)) / 100 * MAXH;
      return '<div class="vbar ' + cls + '" style="height:' + h.toFixed(0) + 'px"><span>' +
        (val === null ? "—" : Math.round(val) + "%") + "</span></div>";
    }
    return '<div class="bar-group"><div class="bar-pair">' + bar(m.clt, "clt") + bar(m.cnx, "cnx") + "</div>" +
      '<div class="bar-mois">' + esc(DASH_MOIS_SHORT[m.mois] || m.mois) + "</div></div>";
  }).join("");
  return '<div class="bar-chart">' + groups + "</div>" +
    dashLegend([["% ADV KPI 1&2 - CLT target", "var(--blue)"], ["% ADV KPI 1&2 - CNX target", "var(--seafoam)"]]);
}

function dashEffectifChart(byMonth) {
  const MAXH = 130;
  const maxTot = Math.max.apply(null, byMonth.map(function (m) { return m.total || 0; }).concat([1]));
  let cols = byMonth.map(function (m) {
    const hTot = Math.max((m.total || 0) / maxTot * MAXH, 6);
    const h3 = (m.m3 || 0) / (m.total || 1) * hTot;
    const hp3 = (m.p3 || 0) / (m.total || 1) * hTot;
    return '<div class="bar-group">' +
      '<div class="stk-total">' + (m.total || 0) + "</div>" +
      '<div class="stk-col" style="height:' + hTot.toFixed(0) + 'px">' +
      '<div class="stk-seg p3" style="height:' + hp3.toFixed(0) + 'px" title="ADV + 3 mois : ' + (m.p3 || 0) + '"></div>' +
      '<div class="stk-seg m3" style="height:' + h3.toFixed(0) + 'px" title="ADV - 3 mois : ' + (m.m3 || 0) + '"></div>' +
      "</div>" +
      '<div class="bar-mois">' + esc(DASH_MOIS_SHORT[m.mois] || m.mois) + "</div></div>";
  }).join("");
  return '<div class="stk">' + cols + "</div>" +
    dashLegend([["ADV - 3 mois", "var(--blue)"], ["ADV + 3 mois", "var(--jade)"], ["Total ADV LIFTED", "var(--sea20)"]]);
}

function dashMselHtml(key, tag, opts, allLabel) {
  return '<div class="msel" data-key="' + key + '">' +
    '<button type="button" class="msel-btn" aria-expanded="false">' +
    '<span class="msel-tag">' + esc(tag) + '</span><b class="msel-val"></b>' +
    '<span class="chev">' + ic("chevron", 14) + "</span></button>" +
    '<div class="msel-panel">' +
    '<label class="msel-all"><input type="checkbox" class="msel-master"> <span>' + esc(allLabel) + "</span></label>" +
    '<div class="msel-opts">' + opts.map(function (o) {
      return '<label class="msel-opt' + (o.count ? "" : " dim") + '">' +
        '<input type="checkbox" value="' + esc(o.id) + '"' + (dashState[key].indexOf(o.id) >= 0 ? " checked" : "") + ">" +
        "<span>" + esc(o.label) + (o.count !== undefined ? '<i class="msel-n">' + o.count + "</i>" : "") + "</span></label>";
    }).join("") + "</div></div></div>";
}

function dashUpdateLabels(scope) {
  $all(".msel", scope).forEach(function (box) {
    const key = box.dataset.key;
    const vals = dashState[key] || [];
    const btn = box.querySelector(".msel-val");
    if (!btn) return;
    const optIds = Array.prototype.slice.call(box.querySelectorAll(".msel-opt input")).map(function (i) { return i.value; });
    let txt;
    if (!vals.length) txt = key === "acts" ? "Aucune activité" : key === "mois" ? "Aucun mois" : "Aucune semaine";
    else if (key === "acts") txt = vals.length === DATA.activities.length ? "Toutes les activités" :
      (vals.length <= 2 ? vals.map(activityLabel).join(", ") : vals.length + " activités");
    else if (key === "mois") txt = vals.length === 12 ? "Tous les mois de l'année" :
      (vals.length <= 2 ? vals.join(", ") : vals.length + " mois");
    else txt = optIds.length && vals.length === optIds.length ? "Toutes les semaines (" + vals.length + ")" :
      (vals.length <= 2 ? vals.join(", ") : vals.length + " semaines");
    btn.textContent = txt;
  });
}

function dashFilteredRows() {
  return store.data.entries.filter(function (e) {
    const a = activityOfRow(e.row);
    if (!a || dashState.acts.indexOf(a.id) < 0) return false;
    if (dashState.mois.indexOf(e.row[7]) < 0) return false;
    const w = String(e.row[8] || "");
    if (dashState.sems.length && (!w || dashState.sems.indexOf(w) < 0)) return false;
    return true;
  });
}

function renderDashBody() {
  const body = $("#dashBody");
  if (!body) return;
  const rows = dashFilteredRows();
  if (!rows.length) {
    body.innerHTML = '<div class="empty">Aucune ligne de performance pour cette sélection. Vérifiez les filtres Activités, Période et Semaines, ou renseignez des lignes via Update_perf.</div>';
    return;
  }
  const advTot = dashSum(rows, 21);
  const adv3 = dashSum(rows, 33), advp3 = dashSum(rows, 40), advC = dashSum(rows, 47);
  const gauges = [
    dashDonut(dashPct(dashSum(rows, 22), advTot), "% ADV AU KPI 1"),
    dashDonut(dashPct(dashSum(rows, 24), advTot), "% ADV AU KPI 2"),
    dashDonut(dashPct(dashSum(rows, 26), advTot), "% ADV AU KPI 1&2"),
    dashDonut(dashPct(dashSum(rows, 52), advC), "% ADV AU KPI 1&2 CNX TARGET"),
    dashDonut(dashPct(dashSum(rows, 38), adv3), "% ADV KPI 1&2 CLT TARGET -3MOIS"),
    dashDonut(dashPct(dashSum(rows, 45), advp3), "% ADV KPI 1&2 CLT TARGET +3MOIS")
  ].join("");
  // Mois sélectionnés présents dans les données Update_perf (ordre du calendrier)
  const byMonth = [];
  MONTHS.forEach(function (m) {
    if (dashState.mois.indexOf(m) < 0) return;
    const mr = rows.filter(function (e) { return e.row[7] === m; });
    if (!mr.length) return;
    const s3 = dashSum(mr, 33), sp3 = dashSum(mr, 40);
    byMonth.push({
      mois: m,
      clt: dashPct(dashSum(mr, 26), dashSum(mr, 21)),
      cnx: dashPct(dashSum(mr, 52), dashSum(mr, 47)),
      m3: s3, p3: sp3,
      total: (s3 || 0) + (sp3 || 0)
    });
  });
  const ro1 = dashAvg(rows, 14), ro2 = dashAvg(rows, 19);
  body.innerHTML =
    '<div class="gauge-row">' + gauges + "</div>" +
    '<div class="dash-duo">' +
    '<div class="card"><h2>% ATTEINTE KPI 1 &amp; 2 PAR MOIS</h2>' + dashAtteinteChart(byMonth) + "</div>" +
    '<div class="card"><h2>EFFECTIF PAR SENIORITE PAR MOIS</h2>' + dashEffectifChart(byMonth) + "</div>" +
    "</div>" +
    '<div class="dash-duo">' +
    '<div class="card">' + dashHalf(ro1 === null ? null : ro1 * 100, "DELIVERY KPI 1") + "</div>" +
    '<div class="card">' + dashHalf(ro2 === null ? null : ro2 * 100, "DELIVERY KPI 2") + "</div>" +
    "</div>";
}

function renderDashboard(root) {
  dashEnsureState();
  const entries = store.data.entries;
  const actOpts = DATA.activities.map(function (a) {
    return { id: a.id, label: a.label,
      count: entries.filter(function (e) { const x = activityOfRow(e.row); return x && x.id === a.id; }).length };
  });
  const moisOpts = MONTHS.map(function (m) {
    return { id: m, label: m, count: entries.filter(function (e) { return e.row[7] === m; }).length };
  });
  const semOpts = uniq(entries.map(function (e) { return String(e.row[8] || ""); }).filter(Boolean))
    .sort(function (a, b) { return parseInt(a.slice(1), 10) - parseInt(b.slice(1), 10); })
    .map(function (w) {
      return { id: w, label: w, count: entries.filter(function (e) { return String(e.row[8] || "") === w; }).length };
    });
  root.innerHTML = pageHead("Tableau de bord",
    "Vue interactive alimentée par vos lignes Update_perf : filtrez avec les menus déroulants (choix multiple possible), tout se recalcule aussitôt.") +
    '<div class="dash-controls">' +
    dashMselHtml("acts", "Activités", actOpts, "Toutes les activités") +
    dashMselHtml("mois", "Période", moisOpts, "Tous les mois de l'année") +
    dashMselHtml("sems", "Semaines", semOpts, "Toutes les semaines") +
    '<button type="button" class="dash-reset" id="dashReset">' + ic("refresh", 14) + " Réinitialiser</button>" +
    "</div>" +
    '<div id="dashBody"></div>';
  $all(".msel", root).forEach(function (box) {
    const key = box.dataset.key;
    const btn = box.querySelector(".msel-btn");
    const master = box.querySelector(".msel-master");
    const opts = Array.prototype.slice.call(box.querySelectorAll(".msel-opt input"));
    const syncMaster = function () {
      const n = dashState[key].length;
      master.checked = n === opts.length && n > 0;
      master.indeterminate = n > 0 && n < opts.length;
    };
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      const wasOpen = box.classList.contains("open");
      $all(".msel.open").forEach(function (b) { b.classList.remove("open"); });
      if (!wasOpen) { box.classList.add("open"); btn.setAttribute("aria-expanded", "true"); }
    });
    master.addEventListener("change", function () {
      dashState[key] = master.checked ? opts.map(function (i) { return i.value; }) : [];
      opts.forEach(function (i) { i.checked = master.checked; });
      syncMaster();
      dashUpdateLabels(document);
      renderDashBody();
    });
    opts.forEach(function (i) {
      i.addEventListener("change", function () {
        dashState[key] = opts.filter(function (c) { return c.checked; }).map(function (c) { return c.value; });
        syncMaster();
        dashUpdateLabels(document);
        renderDashBody();
      });
    });
    syncMaster();
  });
  $("#dashReset").addEventListener("click", function () {
    dashState = null;
    renderDashboard($("#main"));
  });
  if (!dashDocBound) {
    dashDocBound = true;
    document.addEventListener("click", function (e) {
      if (!e.target.closest || !e.target.closest(".msel")) {
        $all(".msel.open").forEach(function (b) { b.classList.remove("open"); });
      }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") $all(".msel.open").forEach(function (b) { b.classList.remove("open"); });
    });
  }
  dashUpdateLabels(root);
  renderDashBody();
}

    fluxes.map(function (f) {
      return '<option value="' + f.id + '"' + (firstFlux.id === f.id ? " selected" : "") + ">" + esc(f.id) + " — " + esc(f.name) + "</option>";
    }).join("") + "</select></div>" +
    '<div class="field"><label for="fMois">MOIS</label><select id="fMois">' +

    }).join("") + "</select></div>" +

  // ----- Liaisons des événements -----
  const fluxSel = $("#fFlux");
  function onFluxChange() {
    const f = fluxOf(fluxSel.value);
    if (!f) return;
    $("#fIdBox").innerHTML = identityBoxHtml(f);
    if (!perfEditId) {
      $("#fType1").value = f.kpi1.type; $("#fT1").value = f.kpi1.target; $("#fR1").value = "";
      $("#fType2").value = f.kpi2.type; $("#fT2").value = f.kpi2.target; $("#fR2").value = "";
    }
  }
  fluxSel.addEventListener("change", onFluxChange);

  $("#perfForm").addEventListener("submit", function (e) {
    e.preventDefault();
    const vals = { fluxId: fluxSel.value.trim(), mois: $("#fMois").value, semaine: $("#fSem").value.trim().toUpperCase(),
      type1: $("#fType1").value, t1: $("#fT1").value, r1: $("#fR1").value,
      type2: $("#fType2").value, t2: $("#fT2").value, r2: $("#fR2").value };
    Object.keys(ADV_IDX).forEach(function (k) { vals[k] = $("#f_" + k).value.trim(); });
    if (!vals.fluxId) { toast("Choisissez un flux."); return; }
    if (!vals.semaine) { toast("Indiquez la semaine (ex : S47)."); return; }
    const req = [["t1", "TARGET KPI 1"], ["r1", "REALISE KPI 1"], ["t2", "TARGET KPI 2"], ["r2", "REALISE KPI 2"]];
    for (let i = 0; i < req.length; i++) {
      if (num(vals[req[i][0]]) === null) { toast("Renseignez " + req[i][1] + " (nombre)."); return; }
    }
    const advKeys = Object.keys(ADV_IDX);
    for (let i = 0; i < advKeys.length; i++) {
      const v = vals[advKeys[i]];
      if (v !== "" && num(v) === null) { toast("Valeur non valide dans le bloc conseillers."); return; }
    }
    const flux = fluxOf(vals.fluxId);
    const newRow = new Array(54).fill("");
    const act2 = flux.activity;
    newRow[0] = act2.country; newRow[1] = act2.client; newRow[2] = act2.clientId;
    newRow[3] = act2.msa; newRow[4] = act2.msaId; newRow[5] = flux.name; newRow[6] = flux.id;
    newRow[7] = vals.mois; newRow[8] = vals.semaine;
    newRow[10] = flux.kpi1.name; newRow[11] = num(vals.t1); newRow[12] = num(vals.r1); newRow[13] = vals.type1;
    newRow[15] = flux.kpi2.name; newRow[16] = num(vals.t2); newRow[17] = num(vals.r2); newRow[18] = vals.type2;
    advKeys.forEach(function (k) { newRow[ADV_IDX[k]] = vals[k] === "" ? "" : num(vals[k]); });
    completeRow(newRow);
    if (perfEditId) {
      store.upsert({ id: perfEditId, row: newRow });
      toast("Saisie modifiée.");
    } else {
      store.upsert({ id: uid(), row: newRow });
      toast("Saisie enregistrée.");
    }
    perfEditId = null;
    renderUpdatePerf(root);
  });

  const cancelBtn = $("#fCancel");
  if (cancelBtn) cancelBtn.addEventListener("click", function () {
    perfEditId = null;
    renderUpdatePerf(root);
  });

  $("#flMois").addEventListener("change", function () { perfFilters.mois = this.value; renderPerfTable(); });
  $("#flSem").addEventListener("change", function () { perfFilters.sem = this.value; renderPerfTable(); });
  $("#flQ").addEventListener("input", function () { perfFilters.q = this.value; renderPerfTable(); });
  $("#perfExport").addEventListener("click", function () {
    const rows = filteredPerfEntries().map(function (e) { return e.row; });
    if (!rows.length) { toast("Rien à exporter."); return; }
    downloadFile("Update_perf_" + act.label.replace(/\s+/g, "") + ".csv",
      csvFromRows(DATA.headers, rows), "text/csv;charset=utf-8");
    toast("Export CSV téléchargé.");
  });

  $("#perfTableWrap").addEventListener("click", function (e) {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const id = btn.dataset.id;
    if (btn.dataset.action === "edit") {
      perfEditId = id;
      renderUpdatePerf(root);
      const card = $("#perfForm");
      if (card) card.scrollIntoView({ behavior: "smooth", block: "start" });
    } else if (btn.dataset.action === "del") {
      const entry = store.data.entries.find(function (x) { return x.id === id; });
      const label = entry ? (entry.row[8] + " · " + entry.row[6]) : "";
      if (confirm("Supprimer cette ligne (" + label + ") ? Cette action est définitive.")) {
        store.remove(id);
        toast("Ligne supprimée.");
        renderPerfTable();
      }
    }
  });

  renderPerfTable();
}

function filteredPerfEntries() {
  const act = currentActivity();
  const q = perfFilters.q.trim().toLowerCase();
  return store.forActivity(act.id).filter(function (e) {
    const r = e.row;
    if (perfFilters.mois && r[7] !== perfFilters.mois) return false;
    if (perfFilters.sem && r[8] !== perfFilters.sem) return false;
    if (q) {
      const hay = (r[5] + " " + r[6] + " " + r[10] + " " + r[15]).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });
}

function filteredTeam() {

      const hay = (c.nom + " " + c.prenom + " " + c.email + " " + c.workday + " " + c.payid + " " + c.niceIexId).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });
}

   STYCH — Alimentation DATA : volet DMT (import des appels Ringover).

const DMT_OBJECTIF = 240; // secondes

const DMT_MATCH = {};

function dmtNorm(s) {
  return String(s || "").toLowerCase().replace(/\s+/g, " ").trim();

/* ---------- Accès à la base de données DMT enregistrée ---------- */
function dmtStore() {
  if (!store.data.dmt) store.data.dmt = { matricules: {}, agg: {}, imports: [] };
  if (!store.data.dmt.agg) store.data.dmt.agg = {};
  if (!store.data.dmt.imports) store.data.dmt.imports = [];
  return store.data.dmt;
}
function dmtMatricule(agentKey) {
  const a = DMT_AGENTS.find(function (x) { return x.key === agentKey; });
  return a ? a.matricule : "";
}

/* ---------- Lecture du CSV (séparateur ; ou , avec guillemets) ---------- */
function dmtDetectSep(text) {
  const nl = text.indexOf("\n");
  const first = nl > 0 ? text.slice(0, nl) : text;
  let sc = 0, cc = 0, inQ = false;
  for (let i = 0; i < first.length; i++) {
    const c = first[i];
    if (inQ) { if (c === '"') inQ = false; }
    else if (c === '"') inQ = true;
    else if (c === ";") sc++;
    else if (c === ",") cc++;
  }
  return sc >= cc ? ";" : ",";
}
function dmtParseCsv(text, sep) {
  const rows = [];
  let row = [], cur = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') {
        if (text[i + 1] === '"') { cur += '"'; i++; } else { inQ = false; }
      } else { cur += c; }
    } else if (c === '"') { inQ = true; }
    else if (c === sep) { row.push(cur); cur = ""; }
    else if (c === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; }
    else if (c !== "\r") { cur += c; }
  }
  if (cur !== "" || row.length > 1) { row.push(cur); rows.push(row); }
  return rows;
}
function dmtDayOf(st) {
  let m = /^\d{4}-\d{2}-\d{2}/.exec(st);
  if (m) return m[0];
  m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(st);
  if (m) return m[3] + "-" + ("0" + m[2]).slice(-2) + "-" + ("0" + m[1]).slice(-2);
  return null;
}

/* ---------- Import : met à jour la base de données ----------
   Même référence de date (agent + jour) présente dans un nouveau
   fichier = l'ancienne valeur est remplacée par la nouvelle. */
function dmtImportFile(text, fileName) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const sep = dmtDetectSep(text);
  const parsed = dmtParseCsv(text, sep);
  if (!parsed.length) return { ok: false, msg: "Fichier vide ou illisible." };
  const header = parsed[0].map(function (h) { return dmtNorm(h); });
  const iUser = header.indexOf("username");
  const iStart = header.indexOf("starttime");
  const iDur = header.indexOf("incallduration");
  if (iUser < 0 || iStart < 0 || iDur < 0) {
    return { ok: false, msg: "Colonnes UserName, StartTime ou InCallDuration non trouvées. " +
      "Colonnes vues : " + parsed[0].join(", ").slice(0, 220) };
  }
  const agg = {};            // "agent|jour" -> { n, s }
  const ignores = {};        // nom hors équipe -> nb d'appels
  let lignes = 0, imputes = 0, sansDate = 0;
  for (let r = 1; r < parsed.length; r++) {
    const cols = parsed[r];
    if (!cols || cols.length < 2 || !String(cols[iUser] || "").trim()) continue;
    lignes++;
    const key = DMT_MATCH[dmtNorm(cols[iUser])];
    if (!key) {
      const n = dmtNorm(cols[iUser]);
      ignores[n] = (ignores[n] || 0) + 1;
      continue;
    }
    const day = dmtDayOf(String(cols[iStart] || "").trim());
    const dur = parseFloat(String(cols[iDur] || "").replace(",", "."));
    if (!day) { sansDate++; continue; }
    if (isNaN(dur) || dur < 0) continue;
    const k = key + "|" + day;
    if (!agg[k]) agg[k] = { n: 0, s: 0 };
    agg[k].n += 1;
    agg[k].s += dur;
    imputes++;
  }
  const report = { ok: true, file: fileName, when: new Date().toISOString(),
    lignes: lignes, imputes: imputes, ignores: ignores, sansDate: sansDate, maj: 0, remp: 0 };
  if (!imputes) {
    report.ok = false;
    report.msg = "Aucun appel des 8 agents Stych dans ce fichier (" + lignes + " lignes lues).";
    return report;
  }
  const st = dmtStore();
  Object.keys(agg).forEach(function (k) {
    if (st.agg[k]) report.remp++;
    st.agg[k] = agg[k];
    report.maj++;
  });
  st.imports.unshift(report);
  if (st.imports.length > 10) st.imports.length = 10;
  store.save();
  return report;
}

/* ---------- Lectures de la base ---------- */
function dmtMonths() {
  const set = {};
  Object.keys(dmtStore().agg).forEach(function (k) { set[k.split("|")[1].slice(0, 7)] = 1; });
  return Object.keys(set).sort();
}
function dmtDays(moisList) {
  const set = {};
  Object.keys(dmtStore().agg).forEach(function (k) {
    const d = k.split("|")[1];
    if (!moisList || !moisList.length || moisList.indexOf(d.slice(0, 7)) >= 0) set[d] = 1;
  });
  return Object.keys(set).sort();
}
function dmtMonthLabel(mo) {
  const mm = parseInt(mo.slice(5, 7), 10) - 1;
  return (MONTHS[mm] || mo) + " " + mo.slice(0, 4);
}
function dmtDayLabel(d) {
  return d.slice(8, 10) + "/" + d.slice(5, 7) + "/" + d.slice(0, 4);
}
/* DMT d'un agent sur la période : (somme des durées) ÷ (nombre d'appels).
   moisList / jourList : listes de valeurs ; liste vide = tout voir. */
function dmtAgentPeriod(agentKey, moisList, jourList) {
  let n = 0, s = 0;
  const agg = dmtStore().agg;
  Object.keys(agg).forEach(function (k) {
    const p = k.split("|");
    if (p[0] !== agentKey) return;
    const d = p[1];
    if (moisList && moisList.length && moisList.indexOf(d.slice(0, 7)) < 0) return;
    if (jourList && jourList.length && jourList.indexOf(d) < 0) return;
    n += agg[k].n;
    s += agg[k].s;
  });
  return n ? { n: n, s: s, dmt: s / n } : null;
}
/* DMT projet sur une période = moyenne des DMT des agents qui ont des appels.
   agentKeys : liste optionnelle de clés d'agents ; vide = toute l'équipe. */
function dmtProjectPeriod(moisList, jourList, agentKeys) {
  let sum = 0, c = 0, n = 0;
  DMT_AGENTS.forEach(function (a) {
    if (agentKeys && agentKeys.length && agentKeys.indexOf(a.key) < 0) return;
    const p = dmtAgentPeriod(a.key, moisList, jourList);
    if (p) { sum += p.dmt; c++; n += p.n; }
  });
  return c ? { dmt: sum / c, agents: c, n: n } : null;
}
function dmtAgentClass(v) { return v === null ? "dim" : (v <= DMT_OBJECTIF ? "dmt-ok" : "dmt-ko"); }

/* ---------- Graphique SVG global (moyenne des agents) ---------- */
function dmtChartSvg(series, granularite, w) {
  const W = w || 820, H = 250, padL = 46, padR = 14, padT = 28, padB = 36;
  const iw = W - padL - padR, ih = H - padT - padB;
  const withVal = series.filter(function (p) { return p.value !== null; });
  const maxData = Math.max.apply(null, withVal.map(function (p) { return p.value; }).concat([0]));
  const maxV = Math.max(DMT_OBJECTIF * 1.3, maxData * 1.15, 60);
  const y = function (v) { return padT + ih - (v / maxV) * ih; };
  const parts = [];
  [0, DMT_OBJECTIF, maxV].forEach(function (v, i) {
    parts.push('<line x1="' + padL + '" y1="' + y(v).toFixed(1) + '" x2="' + (W - padR) +
      '" y2="' + y(v).toFixed(1) + '" stroke="' + (i === 1 ? "var(--raspberry)" : "var(--border)") +
      '" stroke-width="1" ' + (i === 1 ? 'stroke-dasharray="6 4"' : "") + '/>');
    parts.push('<text x="' + (padL - 8) + '" y="' + (y(v) + 4).toFixed(1) +
      '" text-anchor="end" font-size="11" fill="var(--dim)">' + Math.round(v) + "</text>");
  });
  parts.push('<text x="' + (padL - 8) + '" y="' + (padT - 14) + '" text-anchor="end" font-size="10.5" fill="var(--dim)">s</text>');
  parts.push('<text x="' + (W - padR) + '" y="' + (y(DMT_OBJECTIF) - 6).toFixed(1) +
    '" text-anchor="end" font-size="11" font-weight="700" fill="var(--raspberry)">Objectif ' + DMT_OBJECTIF + " s</text>");
  const slot = iw / Math.max(series.length, 1);
  const bw = Math.min(44, slot * 0.62);
  const every = Math.ceil(series.length / 17);
  series.forEach(function (p, i) {
    const x = padL + slot * i + (slot - bw) / 2;
    if (p.value !== null) {
      const h = Math.max(2, ih - (p.value / maxV) * ih);
      const col = p.value <= DMT_OBJECTIF ? "var(--jade)" : "var(--raspberry)";
      parts.push('<rect x="' + x.toFixed(1) + '" y="' + (padT + ih - h).toFixed(1) +
        '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="4" fill="' + col + '">' +
        "<title>" + esc(p.full + " : " + fmtFr(p.value, 1) + " s — " + p.agents + " agent(s), " +
        p.n + " appel(s)") + "</title></rect>");
      parts.push('<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (padT + ih - h - 5).toFixed(1) +
        '" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--midnight)">' +
        Math.round(p.value) + "</text>");
    } else {
      parts.push('<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (padT + 12) +
        '" text-anchor="middle" font-size="10.5" fill="var(--dim)">—</text>');
    }
    if (i % every === 0) {
      parts.push('<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 14) +
        '" text-anchor="middle" font-size="10.5" fill="var(--dim)">' + esc(p.label) + "</text>");
    }
  });
  return '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="DMT globale du projet ' +
    granularite + ', objectif ' + DMT_OBJECTIF + ' secondes">' + parts.join("") + "</svg>";
}

const SATCLI_OBJECTIF = 3.8;

/* Équipe SATCLI (9 personnes) : les 8 agents DMT + Nirintsoa.

const SATCLI_AGENTS = DMT_AGENTS.concat([

/* ---------- Accès aux données SATCLI enregistrées ---------- */
function satcliStore() {
  if (!store.data.satcli) store.data.satcli = { vals: {}, dates: {} };
  if (!store.data.satcli.vals) store.data.satcli.vals = {};
  if (!store.data.satcli.dates) store.data.satcli.dates = {};
  return store.data.satcli;
}
/* Valeur en vigueur : saisie dans l'outil (remplace), sinon référence */
function satcliValue(agentKey, mo) {
  const s = satcliStore();
  if (s.vals[agentKey + "|" + mo] !== undefined) return s.vals[agentKey + "|" + mo];
  const b = SATCLI_BASE[mo];
  return b && b.vals[agentKey] !== undefined ? b.vals[agentKey] : null;
}
function satcliMonths() {
  const set = {};
  Object.keys(SATCLI_BASE).forEach(function (m) { set[m] = 1; });
  Object.keys(satcliStore().vals).forEach(function (k) {
    const m = k.split("|")[1];
    if (m) set[m] = 1;
  });
  return Object.keys(set).sort();
}
function satcliDateOf(mo) {
  const s = satcliStore();
  if (s.dates[mo]) return s.dates[mo];
  if (SATCLI_BASE[mo] && SATCLI_BASE[mo].date) return SATCLI_BASE[mo].date;
  return mo + "-01";
}
/* SATCLI projet d'un mois = moyenne des agents qui ont une valeur.
   agentKeys : liste optionnelle de clés d'agents ; vide = toute l'équipe. */
function satcliMonthAvg(mo, agentKeys) {
  let sum = 0, c = 0;
  SATCLI_AGENTS.forEach(function (a) {
    if (agentKeys && agentKeys.length && agentKeys.indexOf(a.key) < 0) return;
    const v = satcliValue(a.key, mo);
    if (v !== null) { sum += v; c++; }
  });
  return c ? { avg: sum / c, agents: c } : null;
}

/* ---------- Graphique SVG : SATCLI projet MTD, un point par mois ---------- */
function satcliChartSvg(series, w) {
  const W = w || 820, H = 250, padL = 46, padR = 14, padT = 28, padB = 36;

  const maxV = 5; // note sur 5
  const y = function (v) { return padT + ih - (v / maxV) * ih; };
  const parts = [];
  [0, SATCLI_OBJECTIF, maxV].forEach(function (v, i) {
    parts.push('<line x1="' + padL + '" y1="' + y(v).toFixed(1) + '" x2="' + (W - padR) +

      '" stroke-width="1" ' + (i === 1 ? 'stroke-dasharray="6 4"' : "") + '/>');
    parts.push('<text x="' + (padL - 8) + '" y="' + (y(v) + 4).toFixed(1) +
      '" text-anchor="end" font-size="11" fill="var(--dim)">' + fmtFr(v, 1) + "</text>");
  });

  parts.push('<text x="' + (W - padR) + '" y="' + (y(SATCLI_OBJECTIF) - 6).toFixed(1) +
    '" text-anchor="end" font-size="11" font-weight="700" fill="var(--raspberry)">Objectif ' +
    fmtFr(SATCLI_OBJECTIF, 1) + "</text>");
  const slot = iw / Math.max(series.length, 1);
  const bw = Math.min(64, slot * 0.62);
  series.forEach(function (p, i) {
    const x = padL + slot * i + (slot - bw) / 2;
    if (p.value !== null) {
      const h = Math.max(2, ih - (p.value / maxV) * ih);
      const col = p.value >= SATCLI_OBJECTIF ? "var(--jade)" : "var(--raspberry)";
      parts.push('<rect x="' + x.toFixed(1) + '" y="' + (padT + ih - h).toFixed(1) +
        '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="4" fill="' + col + '">' +
        "<title>" + esc(p.full + " : " + fmtFr(p.value, 2) + " — " + p.agents + " agent(s) avec valeur") + "</title></rect>");
      parts.push('<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (padT + ih - h - 5).toFixed(1) +
        '" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--midnight)">' +
        fmtFr(p.value, 1) + "</text>");
    } else {
      parts.push('<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (padT + 12) +
        '" text-anchor="middle" font-size="10.5" fill="var(--dim)">—</text>');

    fmtFr(SATCLI_OBJECTIF, 1) + '">' + parts.join("") + "</svg>";
}
